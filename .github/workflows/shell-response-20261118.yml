name: Shell response and angular variance
on:
  push:
    paths: ['research/HDBLAST_SHELL_RESPONSE_20261118/**', '.github/workflows/shell-response-20261118.yml']
  pull_request:
    paths: ['research/HDBLAST_SHELL_RESPONSE_20261118/**', '.github/workflows/shell-response-20261118.yml']
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: research/HDBLAST_SHELL_RESPONSE_20261118
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the archived inputs and both exact replays
        working-directory: research/HDBLAST_SHELL_RESPONSE_20261118
        run: |
          echo '9bbd42e43f31b4d17b722a3959b262d22fb4d9911bb2abdd9ef12a571b142ae1  SHA256SUMS' | sha256sum -c -
          sha256sum -c SHA256SUMS
          python -I -B replay.py > "$RUNNER_TEMP/normal.json"
          python -I -B -O replay.py > "$RUNNER_TEMP/optimized.json"
          cmp RESULTS.json "$RUNNER_TEMP/normal.json"
          cmp RESULTS.json "$RUNNER_TEMP/optimized.json"
