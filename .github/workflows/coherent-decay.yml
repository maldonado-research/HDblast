name: Coherent parents and charged daughter heating
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/HDBLAST_COHERENT_DECAY_20261120/**'
      - '.github/workflows/coherent-decay.yml'
      - 'research/HDBLAST_DRIVEN_PARENT_SUPPLY_20261120/coupled/PARENT.json'
      - 'research/HDBLAST_DRIVEN_PARENT_SUPPLY_20261120/coupled/production.py'
      - 'research/HDBLAST_DRIVEN_PARENT_SUPPLY_20261120/coupled/production_forward.cpp'
      - 'research/HDBLAST_DRIVEN_PARENT_SUPPLY_20261120/coupled/narrow_cases.json'
  push:
    branches: [main]
    paths:
      - 'research/HDBLAST_COHERENT_DECAY_20261120/**'
      - '.github/workflows/coherent-decay.yml'
      - 'research/HDBLAST_DRIVEN_PARENT_SUPPLY_20261120/coupled/PARENT.json'
      - 'research/HDBLAST_DRIVEN_PARENT_SUPPLY_20261120/coupled/production.py'
      - 'research/HDBLAST_DRIVEN_PARENT_SUPPLY_20261120/coupled/production_forward.cpp'
      - 'research/HDBLAST_DRIVEN_PARENT_SUPPLY_20261120/coupled/narrow_cases.json'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  replay:
    name: Reproduce parent excitation, conversion and daughter heating
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: research/HDBLAST_COHERENT_DECAY_20261120
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/HDBLAST_COHERENT_DECAY_20261120/
            /research/HDBLAST_DRIVEN_PARENT_SUPPLY_20261120/coupled/PARENT.json
            /research/HDBLAST_DRIVEN_PARENT_SUPPLY_20261120/coupled/production.py
            /research/HDBLAST_DRIVEN_PARENT_SUPPLY_20261120/coupled/production_forward.cpp
            /research/HDBLAST_DRIVEN_PARENT_SUPPLY_20261120/coupled/narrow_cases.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the preceding parent trajectories and solver
        run: |
          gzip -dc prior/PARENT.json.gz | cmp - ../HDBLAST_DRIVEN_PARENT_SUPPLY_20261120/coupled/PARENT.json
          cmp prior/production.py ../HDBLAST_DRIVEN_PARENT_SUPPLY_20261120/coupled/production.py
          cmp prior/production_forward.cpp ../HDBLAST_DRIVEN_PARENT_SUPPLY_20261120/coupled/production_forward.cpp
          cmp prior/narrow_cases.json ../HDBLAST_DRIVEN_PARENT_SUPPLY_20261120/coupled/narrow_cases.json
      - name: Verify the release files and pinned inputs
        run: |
          echo 'ff279cd6f1d6b79113b2c2c390f10153418aa98997ebd969b813545f803040fa  SHA256SUMS' | sha256sum -c -
          python -I -B -S study.py
      - name: Run the numerical calculations and their controls
        run: |
          python -m pip install numpy==2.3.5 scipy==1.17.0
          python -I -B study.py --verify --output-dir "$RUNNER_TEMP/coherent-replay"
