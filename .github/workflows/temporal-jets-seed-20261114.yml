name: Nonlinear initial temporal jets and compatible seed replay
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/HDBLAST_TEMPORAL_JETS_SEED_20261114/**'
      - '.github/workflows/temporal-jets-seed-20261114.yml'
  push:
    branches: [main]
    paths:
      - 'research/HDBLAST_TEMPORAL_JETS_SEED_20261114/**'
      - '.github/workflows/temporal-jets-seed-20261114.yml'
permissions:
  contents: read
jobs:
  temporal-seed-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Install exact hash-pinned algebra wheels
        run: |
          python -m venv "$RUNNER_TEMP/temporal-seed-env"
          "$RUNNER_TEMP/temporal-seed-env/bin/python" -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r research/HDBLAST_TEMPORAL_JETS_SEED_20261114/requirements-checks.txt
      - name: Replay the authenticated initial recursion, Gaussian and admission ledgers in both modes
        run: |
          "$RUNNER_TEMP/temporal-seed-env/bin/python" -I -B research/HDBLAST_TEMPORAL_JETS_SEED_20261114/checks/check_checkpoint.py --manifest-sha256 9f623205d8ba6198951d25e36105ff7fdbaa3a9afbaca3f96fb49b92d9532e3e --output "$RUNNER_TEMP/temporal-seed-normal.json"
          "$RUNNER_TEMP/temporal-seed-env/bin/python" -O -I -B research/HDBLAST_TEMPORAL_JETS_SEED_20261114/checks/check_checkpoint.py --manifest-sha256 9f623205d8ba6198951d25e36105ff7fdbaa3a9afbaca3f96fb49b92d9532e3e --output "$RUNNER_TEMP/temporal-seed-optimized.json"
          cmp "$RUNNER_TEMP/temporal-seed-normal.json" "$RUNNER_TEMP/temporal-seed-optimized.json"
      - name: Reject protocol faults and freshly rehashed mathematical faults
        run: |
          "$RUNNER_TEMP/temporal-seed-env/bin/python" -I -B research/HDBLAST_TEMPORAL_JETS_SEED_20261114/checks/run_controls.py --manifest-sha256 9f623205d8ba6198951d25e36105ff7fdbaa3a9afbaca3f96fb49b92d9532e3e --output-dir "$RUNNER_TEMP/temporal-seed-auth-fresh"
          "$RUNNER_TEMP/temporal-seed-env/bin/python" -I -B research/HDBLAST_TEMPORAL_JETS_SEED_20261114/checks/run_math_controls.py --manifest-sha256 9f623205d8ba6198951d25e36105ff7fdbaa3a9afbaca3f96fb49b92d9532e3e --output-dir "$RUNNER_TEMP/temporal-seed-math-fresh"
