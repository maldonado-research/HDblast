name: Curved Maxwell waves and a scalar wall
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/HDBLAST_CURVED_MAXWELL_SCALAR_WALL_20261120/**'
      - '.github/workflows/curved-maxwell-scalar-wall.yml'
      - 'research/HDBLAST_INCIDENT_WAVE_WALL_JUNCTION_20261120/junction/scalar_capture.py'
      - 'research/HDBLAST_INCIDENT_WAVE_WALL_JUNCTION_20261120/junction/radiation_exit.py'
      - 'research/HDBLAST_INCIDENT_WAVE_WALL_JUNCTION_20261120/junction/JUNCTION.json'
  push:
    branches: [main]
    paths:
      - 'research/HDBLAST_CURVED_MAXWELL_SCALAR_WALL_20261120/**'
      - '.github/workflows/curved-maxwell-scalar-wall.yml'
      - 'research/HDBLAST_INCIDENT_WAVE_WALL_JUNCTION_20261120/junction/scalar_capture.py'
      - 'research/HDBLAST_INCIDENT_WAVE_WALL_JUNCTION_20261120/junction/radiation_exit.py'
      - 'research/HDBLAST_INCIDENT_WAVE_WALL_JUNCTION_20261120/junction/JUNCTION.json'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  reproduce:
    name: Reproduce the curved Maxwell and scalar wall calculations
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: research/HDBLAST_CURVED_MAXWELL_SCALAR_WALL_20261120
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/HDBLAST_CURVED_MAXWELL_SCALAR_WALL_20261120/
            /research/HDBLAST_INCIDENT_WAVE_WALL_JUNCTION_20261120/junction/scalar_capture.py
            /research/HDBLAST_INCIDENT_WAVE_WALL_JUNCTION_20261120/junction/radiation_exit.py
            /research/HDBLAST_INCIDENT_WAVE_WALL_JUNCTION_20261120/junction/JUNCTION.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the archive and its historical inputs
        run: |
          echo '83580772a4616359c0a33484421d204ae4322dc819509a59fb40c8a772a4cb5b  SHA256SUMS' | sha256sum -c -
          python -I -B -S reproduce.py
          python -I -B -S - <<'PYTHON'
          import json
          from pathlib import Path
          root = Path.cwd().parents[1]
          for record in json.loads(Path("SOURCES.json").read_text())["sources"]:
              if (root / record["path"]).read_bytes() != Path(record["bundled"]).read_bytes():
                  raise ValueError("Historical input differs from its repository path: " + record["path"])
          PYTHON
      - name: Regenerate the numerical results
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python -m pip install numpy==2.3.5 scipy==1.17.0
          python -I -B reproduce.py --verify --jobs 2
