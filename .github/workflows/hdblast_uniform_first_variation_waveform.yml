name: Uniform first-variation waveform enclosure replay

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/HDBLAST_UNIFORM_FIRST_VARIATION_WAVEFORM_20261015/**'
      - 'research/HDBLAST_UNIFORM_FIRST_VARIATION_WAVEFORM_20261015.zip'
      - '.github/workflows/hdblast_uniform_first_variation_waveform.yml'
  push:
    branches: [main]
    paths:
      - 'research/HDBLAST_UNIFORM_FIRST_VARIATION_WAVEFORM_20261015/**'
      - 'research/HDBLAST_UNIFORM_FIRST_VARIATION_WAVEFORM_20261015.zip'
      - '.github/workflows/hdblast_uniform_first_variation_waveform.yml'

permissions:
  contents: read

concurrency:
  group: uniform-first-variation-waveform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fresh-independent-replay:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      PROOF_DIRECTORY: research/HDBLAST_UNIFORM_FIRST_VARIATION_WAVEFORM_20261015
      MANIFEST_SHA256: 'ecec45eb05d75dd0ca68996b58388d82ce58409a94db9c715b2a4c8c7d38eaf8'
      ARCHIVE_SHA256: '706e915e566956ff9beb7815689d673afe7a2a15b5a6f8d6829624ad608aaebe'
      RUNNER_SHA256: '87af38f3505a3f0079bc296a280887a2549dd4d362cb538eaf34625422cf7031'
      VERIFIER_SHA256: '969b78bbb00bb7902b1c48eb6fd38305dbb6a28edcca9eb3ae8a8ee9e8cc46b6'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /${{ env.PROOF_DIRECTORY }}/
            /${{ env.PROOF_DIRECTORY }}.zip
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Authenticate manifest, executable bytes and matching ZIP before imports
        shell: bash
        run: |
          set -euo pipefail
          python -I -S -B - <<'PY'
          import hashlib, os, pathlib, shutil, zipfile
          root = pathlib.Path(os.environ['PROOF_DIRECTORY'])
          for name, variable in [('MANIFEST.json', 'MANIFEST_SHA256'),
                                 ('reproduce.py', 'RUNNER_SHA256'),
                                 ('verify_manifest.py', 'VERIFIER_SHA256')]:
              path = root / name
              if any(p.is_symlink() for p in [path, *path.parents]):
                  raise RuntimeError('Real source files required')
              if hashlib.sha256(path.read_bytes()).hexdigest() != os.environ[variable]:
                  raise RuntimeError('External pin differs: ' + name)
          archive = root.with_suffix('.zip')
          if archive.is_symlink() or hashlib.sha256(archive.read_bytes()).hexdigest() != os.environ['ARCHIVE_SHA256']:
              raise RuntimeError('Archive pin differs')
          expected = {p.relative_to(root.parent).as_posix(): p.read_bytes()
                      for p in root.rglob('*') if p.is_file()}
          with zipfile.ZipFile(archive) as zipped:
              if len(zipped.namelist()) != len(expected) or set(zipped.namelist()) != set(expected):
                  raise RuntimeError('Archive members differ')
              if any(zipped.read(name) != raw for name, raw in expected.items()):
                  raise RuntimeError('Archive and source differ')
          shutil.copytree(root, pathlib.Path(os.environ['RUNNER_TEMP']) / 'HDBLAST_UNIFORM_FIRST_VARIATION_WAVEFORM_20261015')
          PY
          python -I -S -B "$RUNNER_TEMP/HDBLAST_UNIFORM_FIRST_VARIATION_WAVEFORM_20261015/verify_manifest.py" --expected "$MANIFEST_SHA256"
      - name: Install pinned symbolic dependency
        run: |
          python -I -B -m pip install --only-binary=:all: -r "$RUNNER_TEMP/HDBLAST_UNIFORM_FIRST_VARIATION_WAVEFORM_20261015/requirements.txt"
      # The frozen runner records its actual checker/control inventory.
      # Finite checks do not formally certify the conditional analytic PDE proof.
      - name: Replay exact checks and required controls in both Python modes
        run: |
          python -I -B "$RUNNER_TEMP/HDBLAST_UNIFORM_FIRST_VARIATION_WAVEFORM_20261015/reproduce.py" --manifest-sha256 "$MANIFEST_SHA256" --output-dir "$RUNNER_TEMP/uniform-first-variation-waveform-fresh"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uniform-first-variation-waveform-contact-${{ github.sha }}
          path: ${{ runner.temp }}/uniform-first-variation-waveform-fresh
          retention-days: 14
