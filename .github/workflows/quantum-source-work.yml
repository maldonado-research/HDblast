name: Quantum source work and shell radiation
on:
  pull_request:
    paths:
      - 'research/HDBLAST_SOURCE_WORK_20261118/**'
      - '.github/workflows/quantum-source-work.yml'
  push:
    paths:
      - 'research/HDBLAST_SOURCE_WORK_20261118/**'
      - '.github/workflows/quantum-source-work.yml'
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/HDBLAST_SOURCE_WORK_20261118
            research/HDBLAST_PULSE_PARTICLE_RESPONSE_20261118
            research/HDBLAST_CHECKPOINT_20260930/B1_derived_chi_source
            research/HDBLAST_CHECKPOINT_20260927/mechanisms/pilot_5d
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the archive manifest
        working-directory: research/HDBLAST_SOURCE_WORK_20261118
        run: |
          echo 'fe52214eabd21e0281b3a7c1d1ef265e0b3707a36ee9a65b31cdc640d75dca69  SHA256SUMS' | sha256sum -c -
          sha256sum --quiet -c SHA256SUMS
      - name: Install numerical dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - name: Recompute source work, field evolution and radiation
        working-directory: research/HDBLAST_SOURCE_WORK_20261118
        run: |
          python -I -B reproduce.py
          python -I -B -O reproduce.py --full
