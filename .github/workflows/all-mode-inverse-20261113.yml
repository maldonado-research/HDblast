name: All-mode weighted initial inverse replay
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/HDBLAST_ALL_MODE_INVERSE_20261113/**'
      - '.github/workflows/all-mode-inverse-20261113.yml'
  push:
    branches: [main]
    paths:
      - 'research/HDBLAST_ALL_MODE_INVERSE_20261113/**'
      - '.github/workflows/all-mode-inverse-20261113.yml'
permissions:
  contents: read
jobs:
  all-mode-inverse:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Install exact hash-pinned algebra wheels
        run: |
          python -m venv "$RUNNER_TEMP/all-mode-env"
          "$RUNNER_TEMP/all-mode-env/bin/python" -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r research/HDBLAST_ALL_MODE_INVERSE_20261113/requirements-checks.txt
      - name: Replay the closed source algebra and inverse ledgers in both modes
        run: |
          "$RUNNER_TEMP/all-mode-env/bin/python" -I -B research/HDBLAST_ALL_MODE_INVERSE_20261113/checks/check_checkpoint.py --manifest-sha256 4f1c53d8073fa26c0640a9531a0784f5e0d8098dba6bf17dfa20eb1663d4bfe7 --output "$RUNNER_TEMP/all-mode-normal.json"
          "$RUNNER_TEMP/all-mode-env/bin/python" -O -I -B research/HDBLAST_ALL_MODE_INVERSE_20261113/checks/check_checkpoint.py --manifest-sha256 4f1c53d8073fa26c0640a9531a0784f5e0d8098dba6bf17dfa20eb1663d4bfe7 --output "$RUNNER_TEMP/all-mode-optimized.json"
          cmp "$RUNNER_TEMP/all-mode-normal.json" "$RUNNER_TEMP/all-mode-optimized.json"
      - name: Reject five authentication faults and forty-two refreshed mathematical faults
        run: '"$RUNNER_TEMP/all-mode-env/bin/python" -I -B research/HDBLAST_ALL_MODE_INVERSE_20261113/checks/run_controls.py --manifest-sha256 4f1c53d8073fa26c0640a9531a0784f5e0d8098dba6bf17dfa20eb1663d4bfe7 --output-dir "$RUNNER_TEMP/all-mode-controls-fresh"'
