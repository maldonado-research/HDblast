name: Shell feedback precision and anchored-volume jet
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/HDBLAST_SHELL_FEEDBACK_PRECISION_20261025/**'
      - 'research/HDBLAST_SHELL_FEEDBACK_PRECISION_20261025.zip'
      - 'hdblast/continuation/2026.10.25-shell-feedback-precision/**'
      - '.github/workflows/shell-feedback-precision-20261025.yml'
  push:
    branches: [main]
    paths:
      - 'research/HDBLAST_SHELL_FEEDBACK_PRECISION_20261025/**'
      - 'research/HDBLAST_SHELL_FEEDBACK_PRECISION_20261025.zip'
      - 'hdblast/continuation/2026.10.25-shell-feedback-precision/**'
      - '.github/workflows/shell-feedback-precision-20261025.yml'
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      HDB_MANIFEST: '1a5ee8aa22953f949da000ba03da3b5a0872e4467a0fbaec9f2d3fe7fba11ec4'
      HDB_ARCHIVE: '66e51ba835dd447bcf4203b7b71e3ed412cdae9c55ce9132031beb5afee10578'
      HDB_REPLAY: '6e60b16ecb1012867b56ec9dd722c4f8bd038974f05f7b992dd967fcb70e2a1f'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/HDBLAST_SHELL_FEEDBACK_PRECISION_20261025/
            /research/HDBLAST_SHELL_FEEDBACK_PRECISION_20261025.zip
            /research/HDBLAST_COUPLED_MEAN_PILOT_20261025/
            /research/HDBLAST_INPUT_PRECISION_20261023/
            /research/HDBLAST_COMMON_GAUGE_FORCING_20261016/
            /research/HDBLAST_NUMERICAL_RESPONSE_INPUTS_20261016/
            /research/HDBLAST_GEOMETRIC_BULK_SOURCES_20261016/
            /research/HDBLAST_FORCED_RESPONSE_BOUNDS_20261023/
            /research/HDBLAST_TOTAL_RESPONSE_PREFLIGHT_20261023/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Authenticate and replay both fixed-budget modes
        shell: bash
        run: |
          set -euo pipefail
          capsule="research/HDBLAST_SHELL_FEEDBACK_PRECISION_20261025"
          printf '%s  %s\n' "$HDB_REPLAY" "$capsule/reproduce.py" | sha256sum --check --strict
          python -I -S -B "$capsule/reproduce.py" \
            --manifest-sha256 "$HDB_MANIFEST" --repo-root "$GITHUB_WORKSPACE" \
            --archive "$capsule.zip" --archive-sha256 "$HDB_ARCHIVE" \
            --output-dir "$RUNNER_TEMP/shell-feedback-precision"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shell-feedback-precision-${{ github.sha }}
          path: ${{ runner.temp }}/shell-feedback-precision/
          if-no-files-found: warn
          retention-days: 30
