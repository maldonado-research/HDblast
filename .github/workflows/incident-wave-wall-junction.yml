name: Incident waves and gravitating wall junctions
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/HDBLAST_INCIDENT_WAVE_WALL_JUNCTION_20261120/**'
      - '.github/workflows/incident-wave-wall-junction.yml'
      - 'research/HDBLAST_BULK_PHOTON_PROPAGATOR_20261120/pulse/box.py'
      - 'research/HDBLAST_BULK_PHOTON_PROPAGATOR_20261120/retarded/retarded.py'
      - 'research/HDBLAST_BULK_PHOTON_PROPAGATOR_20261120/bounds/BOUNDS.json'
      - 'research/HDBLAST_BULK_PHOTON_PROPAGATOR_20261120/prior/archive/blast_common.py'
  push:
    branches: [main]
    paths:
      - 'research/HDBLAST_INCIDENT_WAVE_WALL_JUNCTION_20261120/**'
      - '.github/workflows/incident-wave-wall-junction.yml'
      - 'research/HDBLAST_BULK_PHOTON_PROPAGATOR_20261120/pulse/box.py'
      - 'research/HDBLAST_BULK_PHOTON_PROPAGATOR_20261120/retarded/retarded.py'
      - 'research/HDBLAST_BULK_PHOTON_PROPAGATOR_20261120/bounds/BOUNDS.json'
      - 'research/HDBLAST_BULK_PHOTON_PROPAGATOR_20261120/prior/archive/blast_common.py'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  reproduce:
    name: Reproduce the incident waves and the wall response
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: research/HDBLAST_INCIDENT_WAVE_WALL_JUNCTION_20261120
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/HDBLAST_INCIDENT_WAVE_WALL_JUNCTION_20261120/
            /research/HDBLAST_BULK_PHOTON_PROPAGATOR_20261120/pulse/box.py
            /research/HDBLAST_BULK_PHOTON_PROPAGATOR_20261120/retarded/retarded.py
            /research/HDBLAST_BULK_PHOTON_PROPAGATOR_20261120/bounds/BOUNDS.json
            /research/HDBLAST_BULK_PHOTON_PROPAGATOR_20261120/prior/archive/blast_common.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the archive and its historical inputs
        run: |
          echo 'df718776559497b9edde72e10e534425f82bb79ae9e2ddbbf7699fdacb8ca1f2  SHA256SUMS' | sha256sum -c -
          python -I -B -S reproduce.py
          python -I -B -S - <<'PYTHON'
          import json
          from pathlib import Path
          root = Path.cwd().parents[1]
          for record in json.loads(Path("SOURCES.json").read_text())["sources"]:
              if (root / record["path"]).read_bytes() != Path(record["bundled"]).read_bytes():
                  raise ValueError("Historical input differs from its repository path: " + record["path"])
          PYTHON
      - name: Regenerate the numerical results
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python -m pip install numpy==2.3.5 scipy==1.17.0
          python -I -B reproduce.py --verify --jobs 2
