name: Coupled bulk update and local bounds
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/HDBLAST_ACTUAL_BULK_UPDATE_20261030/**'
      - '.github/workflows/actual-bulk-update-20261030.yml'
  push:
    branches: [main]
    paths:
      - 'research/HDBLAST_ACTUAL_BULK_UPDATE_20261030/**'
      - '.github/workflows/actual-bulk-update-20261030.yml'
permissions:
  contents: read
jobs:
  exact-and-interval-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Exact identities, source audits and local bounds in both modes
        shell: bash
        run: |
          set -euo pipefail
          cap=research/HDBLAST_ACTUAL_BULK_UPDATE_20261030
          python -I -S -B "$cap/checks/check_bulk_update_identities.py" > "$RUNNER_TEMP/identities.normal.json"
          python -I -S -B -O "$cap/checks/check_bulk_update_identities.py" > "$RUNNER_TEMP/identities.optimized.json"
          cmp "$RUNNER_TEMP/identities.normal.json" "$RUNNER_TEMP/identities.optimized.json"
          cat "$RUNNER_TEMP/identities.normal.json"
          for mode in normal optimized; do
            flags=()
            if [ "$mode" = optimized ]; then flags=(-O); fi
            python -I -S -B "${flags[@]}" "$cap/checks/check_bulk_update_bound.py" --repo-root . > "$RUNNER_TEMP/BULK_BOUND.$mode.json"
            python -I -S -B "${flags[@]}" "$cap/checks/check_bulk_coarse.py" --repo-root . > "$RUNNER_TEMP/COARSE.$mode.json"
            python -I -S -B "${flags[@]}" "$cap/checks/check_bulk_point_residual.py" --repo-root . > "$RUNNER_TEMP/POINT_RESIDUAL.$mode.json"
            python -I -S -B "${flags[@]}" "$cap/checks/check_point_residual_audit.py" --repo-root . --residual-report "$RUNNER_TEMP/POINT_RESIDUAL.$mode.json" > "$RUNNER_TEMP/POINT_AUDIT.$mode.json"
            python -I -S -B "${flags[@]}" "$cap/checks/check_local_bulk_enclosure.py" --repo-root . --bound-report "$RUNNER_TEMP/BULK_BOUND.$mode.json" > "$RUNNER_TEMP/LOCAL.$mode.json"
            python -I -S -B "${flags[@]}" "$cap/checks/check_result_consistency.py" --repo-root . --bound-report "$RUNNER_TEMP/BULK_BOUND.$mode.json" --point-report "$RUNNER_TEMP/POINT_RESIDUAL.$mode.json" --local-report "$RUNNER_TEMP/LOCAL.$mode.json" > "$RUNNER_TEMP/SUMMARY.$mode.json"
          done
          for report in BULK_BOUND COARSE POINT_RESIDUAL POINT_AUDIT LOCAL SUMMARY; do
            cmp "$RUNNER_TEMP/$report.normal.json" "$RUNNER_TEMP/$report.optimized.json"
            cmp "$RUNNER_TEMP/$report.normal.json" "$cap/reference/$report.json"
          done
          cat "$RUNNER_TEMP/SUMMARY.normal.json"
