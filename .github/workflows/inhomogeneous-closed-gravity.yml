name: Closed Einstein scalar evolution
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/HDBLAST_INHOMOGENEOUS_CLOSED_GRAVITY_20261119/**'
      - '.github/workflows/inhomogeneous-closed-gravity.yml'
      - 'research/HDBLAST_CLOSED_HILLTOP_PREPARATION_20261119/nonlinear/NONLINEAR.json'
      - 'research/HDBLAST_CLOSED_HILLTOP_PREPARATION_20261119/nonlinear/nonlinear.py'
      - 'research/HDBLAST_CLOSED_HILLTOP_PREPARATION_20261119/prior/archive/BLAST_REHEATING_RESULTS.json'
      - 'research/HDBLAST_CLOSED_HILLTOP_PREPARATION_20261119/prior/archive/blast_common.py'
      - 'research/HDBLAST_CLOSED_HILLTOP_PREPARATION_20261119/prior/background/background.py'
      - 'research/HDBLAST_CLOSED_HILLTOP_PREPARATION_20261119/prior/curvature/curvature.py'
      - 'research/HDBLAST_CLOSED_HILLTOP_PREPARATION_20261119/prior/hilltop/HILLTOP.json'
      - 'research/HDBLAST_CLOSED_HILLTOP_PREPARATION_20261119/prior/hilltop/check.py'
      - 'research/HDBLAST_CLOSED_HILLTOP_PREPARATION_20261119/prior/hilltop/hilltop.py'
  push:
    branches: [main]
    paths:
      - 'research/HDBLAST_INHOMOGENEOUS_CLOSED_GRAVITY_20261119/**'
      - '.github/workflows/inhomogeneous-closed-gravity.yml'
      - 'research/HDBLAST_CLOSED_HILLTOP_PREPARATION_20261119/nonlinear/NONLINEAR.json'
      - 'research/HDBLAST_CLOSED_HILLTOP_PREPARATION_20261119/nonlinear/nonlinear.py'
      - 'research/HDBLAST_CLOSED_HILLTOP_PREPARATION_20261119/prior/archive/BLAST_REHEATING_RESULTS.json'
      - 'research/HDBLAST_CLOSED_HILLTOP_PREPARATION_20261119/prior/archive/blast_common.py'
      - 'research/HDBLAST_CLOSED_HILLTOP_PREPARATION_20261119/prior/background/background.py'
      - 'research/HDBLAST_CLOSED_HILLTOP_PREPARATION_20261119/prior/curvature/curvature.py'
      - 'research/HDBLAST_CLOSED_HILLTOP_PREPARATION_20261119/prior/hilltop/HILLTOP.json'
      - 'research/HDBLAST_CLOSED_HILLTOP_PREPARATION_20261119/prior/hilltop/check.py'
      - 'research/HDBLAST_CLOSED_HILLTOP_PREPARATION_20261119/prior/hilltop/hilltop.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    name: Regenerate constrained initial data and coupled Einstein–scalar evolution
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: research/HDBLAST_INHOMOGENEOUS_CLOSED_GRAVITY_20261119
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/HDBLAST_INHOMOGENEOUS_CLOSED_GRAVITY_20261119/
            /research/HDBLAST_CLOSED_HILLTOP_PREPARATION_20261119/nonlinear/NONLINEAR.json
            /research/HDBLAST_CLOSED_HILLTOP_PREPARATION_20261119/nonlinear/nonlinear.py
            /research/HDBLAST_CLOSED_HILLTOP_PREPARATION_20261119/prior/archive/BLAST_REHEATING_RESULTS.json
            /research/HDBLAST_CLOSED_HILLTOP_PREPARATION_20261119/prior/archive/blast_common.py
            /research/HDBLAST_CLOSED_HILLTOP_PREPARATION_20261119/prior/background/background.py
            /research/HDBLAST_CLOSED_HILLTOP_PREPARATION_20261119/prior/curvature/curvature.py
            /research/HDBLAST_CLOSED_HILLTOP_PREPARATION_20261119/prior/hilltop/HILLTOP.json
            /research/HDBLAST_CLOSED_HILLTOP_PREPARATION_20261119/prior/hilltop/check.py
            /research/HDBLAST_CLOSED_HILLTOP_PREPARATION_20261119/prior/hilltop/hilltop.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify study and historical inputs
        run: |
          echo '6f2199b3d4c57a034b0fa9f1389eb171915ab68e2287a4fdef74605e4dfdfd56  SHA256SUMS' | sha256sum -c -
          python -I -B -S reproduce.py
          python -c "import json, pathlib; s=pathlib.Path('.'); root=s.resolve().parents[1]; pins=json.loads((s/'SOURCES.json').read_text()); assert all((s/p['bundled']).read_bytes()==(root/p['path']).read_bytes() for p in pins['sources'])"
      - name: Replay the scientific experiments
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python -m pip install numpy==2.3.5 scipy==1.17.0
          python -I -B reproduce.py --verify --jobs 2
