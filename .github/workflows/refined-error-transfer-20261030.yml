name: Refined coordinate errors and conditional natural transfer
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/HDBLAST_REFINED_ERROR_TRANSFER_20261030/**'
      - '.github/workflows/refined-error-transfer-20261030.yml'
  push:
    branches: [main]
    paths:
      - 'research/HDBLAST_REFINED_ERROR_TRANSFER_20261030/**'
      - '.github/workflows/refined-error-transfer-20261030.yml'
permissions:
  contents: read
jobs:
  exact-error-transfer-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Reproduce interval leaves, audits, normalized bounds and conditional transfers
        run: python -I -S -B research/HDBLAST_REFINED_ERROR_TRANSFER_20261030/checks/run_checkpoint.py --repo-root . --output-dir "$RUNNER_TEMP/refined-error-fresh"
