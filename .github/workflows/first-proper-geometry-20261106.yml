name: First proper geometry replay
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/HDBLAST_FIRST_PROPER_GEOMETRY_20261106/**'
      - '.github/workflows/first-proper-geometry-20261106.yml'
  push:
    branches: [main]
    paths:
      - 'research/HDBLAST_FIRST_PROPER_GEOMETRY_20261106/**'
      - '.github/workflows/first-proper-geometry-20261106.yml'
permissions:
  contents: read
jobs:
  first-proper-geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Evaluate actual first geometry in both Python modes
        run: |
          python -I -S -B research/HDBLAST_FIRST_PROPER_GEOMETRY_20261106/checks/check_checkpoint.py --manifest-sha256 03096165a163ee41325bd3f6999d6778ccef499baa97ff14f79c1110c9fee8c1 --output "$RUNNER_TEMP/first-geometry-normal.json"
          python -O -I -S -B research/HDBLAST_FIRST_PROPER_GEOMETRY_20261106/checks/check_checkpoint.py --manifest-sha256 03096165a163ee41325bd3f6999d6778ccef499baa97ff14f79c1110c9fee8c1 --output "$RUNNER_TEMP/first-geometry-optimized.json"
          cmp "$RUNNER_TEMP/first-geometry-normal.json" "$RUNNER_TEMP/first-geometry-optimized.json"
      - name: Reject six source, arithmetic or path errors
        run: python -I -S -B research/HDBLAST_FIRST_PROPER_GEOMETRY_20261106/checks/run_controls.py --manifest-sha256 03096165a163ee41325bd3f6999d6778ccef499baa97ff14f79c1110c9fee8c1 --output-dir "$RUNNER_TEMP/first-geometry-controls-fresh"
