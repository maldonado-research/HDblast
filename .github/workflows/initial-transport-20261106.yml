name: Initial chart transport replay
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/HDBLAST_INITIAL_TRANSPORT_20261106/**'
      - '.github/workflows/initial-transport-20261106.yml'
  push:
    branches: [main]
    paths:
      - 'research/HDBLAST_INITIAL_TRANSPORT_20261106/**'
      - '.github/workflows/initial-transport-20261106.yml'
permissions:
  contents: read
jobs:
  initial-transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Replay initial root, flow and Sobolev transport in both modes
        run: |
          python -I -S -B research/HDBLAST_INITIAL_TRANSPORT_20261106/checks/check_checkpoint.py --manifest-sha256 af02265734c74bbd3084c48915029acc95be8173baf205e3c4c9a913dafe7819 --output "$RUNNER_TEMP/initial-transport-normal.json"
          python -O -I -S -B research/HDBLAST_INITIAL_TRANSPORT_20261106/checks/check_checkpoint.py --manifest-sha256 af02265734c74bbd3084c48915029acc95be8173baf205e3c4c9a913dafe7819 --output "$RUNNER_TEMP/initial-transport-optimized.json"
          cmp "$RUNNER_TEMP/initial-transport-normal.json" "$RUNNER_TEMP/initial-transport-optimized.json"
      - name: Reject seven source, manifest and arithmetic corruptions
        run: python -I -S -B research/HDBLAST_INITIAL_TRANSPORT_20261106/checks/run_controls.py --manifest-sha256 af02265734c74bbd3084c48915029acc95be8173baf205e3c4c9a913dafe7819 --output-dir "$RUNNER_TEMP/initial-transport-controls-fresh"
