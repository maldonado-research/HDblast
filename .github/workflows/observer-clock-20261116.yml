name: Common observer and proper-clock replay
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/HDBLAST_OBSERVER_CLOCK_20261116/**'
      - '.github/workflows/observer-clock-20261116.yml'
  push:
    branches: [main]
    paths:
      - 'research/HDBLAST_OBSERVER_CLOCK_20261116/**'
      - '.github/workflows/observer-clock-20261116.yml'
permissions:
  contents: read
jobs:
  observer-clock-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Install exact hash-pinned algebra wheels
        run: |
          python -m venv "$RUNNER_TEMP/observer-clock-env"
          "$RUNNER_TEMP/observer-clock-env/bin/python" -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r research/HDBLAST_OBSERVER_CLOCK_20261116/requirements-checks.txt
      - name: Replay the authenticated source and observer algebra interfaces in both modes
        run: |
          "$RUNNER_TEMP/observer-clock-env/bin/python" -I -B research/HDBLAST_OBSERVER_CLOCK_20261116/checks/check_checkpoint.py --manifest-sha256 42959e203359c33e0354e048bf06c7cbd9307a680cee9b3bde27a1b9077ae025 --output "$RUNNER_TEMP/observer-clock-normal.json"
          "$RUNNER_TEMP/observer-clock-env/bin/python" -O -I -B research/HDBLAST_OBSERVER_CLOCK_20261116/checks/check_checkpoint.py --manifest-sha256 42959e203359c33e0354e048bf06c7cbd9307a680cee9b3bde27a1b9077ae025 --output "$RUNNER_TEMP/observer-clock-optimized.json"
          cmp "$RUNNER_TEMP/observer-clock-normal.json" "$RUNNER_TEMP/observer-clock-optimized.json"
      - name: Reject protocol faults and freshly rehashed mathematical faults
        run: |
          "$RUNNER_TEMP/observer-clock-env/bin/python" -I -B research/HDBLAST_OBSERVER_CLOCK_20261116/checks/run_controls.py --manifest-sha256 42959e203359c33e0354e048bf06c7cbd9307a680cee9b3bde27a1b9077ae025 --output-dir "$RUNNER_TEMP/observer-clock-auth-fresh"
          "$RUNNER_TEMP/observer-clock-env/bin/python" -O -I -B research/HDBLAST_OBSERVER_CLOCK_20261116/checks/run_math_controls.py --manifest-sha256 42959e203359c33e0354e048bf06c7cbd9307a680cee9b3bde27a1b9077ae025 --output-dir "$RUNNER_TEMP/observer-clock-math-fresh"
