name: Quadratic proper area replay
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/HDBLAST_QUADRATIC_PROPER_AREA_20261106/**'
      - '.github/workflows/quadratic-proper-area-20261106.yml'
  push:
    branches: [main]
    paths:
      - 'research/HDBLAST_QUADRATIC_PROPER_AREA_20261106/**'
      - '.github/workflows/quadratic-proper-area-20261106.yml'
permissions:
  contents: read
jobs:
  quadratic-proper-area:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Evaluate quadratic proper-area checks in both Python modes
        run: |
          python -I -S -B research/HDBLAST_QUADRATIC_PROPER_AREA_20261106/checks/check_checkpoint.py --manifest-sha256 a3e1bd50289cfec342f4963d35248f8fb55e75338b8175746b9dce660eede2cd --output "$RUNNER_TEMP/quadratic-area-normal.json"
          python -O -I -S -B research/HDBLAST_QUADRATIC_PROPER_AREA_20261106/checks/check_checkpoint.py --manifest-sha256 a3e1bd50289cfec342f4963d35248f8fb55e75338b8175746b9dce660eede2cd --output "$RUNNER_TEMP/quadratic-area-optimized.json"
          cmp "$RUNNER_TEMP/quadratic-area-normal.json" "$RUNNER_TEMP/quadratic-area-optimized.json"
      - name: Reject six source, arithmetic or path errors
        run: python -I -S -B research/HDBLAST_QUADRATIC_PROPER_AREA_20261106/checks/run_controls.py --manifest-sha256 a3e1bd50289cfec342f4963d35248f8fb55e75338b8175746b9dce660eede2cd --output-dir "$RUNNER_TEMP/quadratic-area-controls-fresh"
