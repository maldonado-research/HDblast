name: Exact packet initial data and response error replay
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/HDBLAST_EXACT_PACKET_INITIAL_20261031/**'
      - '.github/workflows/exact-packet-initial-20261031.yml'
  push:
    branches: [main]
    paths:
      - 'research/HDBLAST_EXACT_PACKET_INITIAL_20261031/**'
      - '.github/workflows/exact-packet-initial-20261031.yml'
permissions:
  contents: read
jobs:
  exact-packet-initial-response:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Reproduce exact initial and response certificates and reject corruptions
        run: python -I -S -B research/HDBLAST_EXACT_PACKET_INITIAL_20261031/checks/run_checkpoint.py --repo-root . --output-dir "$RUNNER_TEMP/exact-packet-initial-fresh"
