name: Smeared quantum states in closed cosmology
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/HDBLAST_SMEARED_QUANTUM_STATES_20261119/**'
      - '.github/workflows/smeared-quantum-states.yml'
      - 'research/HDBLAST_CLOSED_TWO_FIELD_ENERGY_EXCHANGE_20261119/checks/phase_work.py'
      - 'research/HDBLAST_CLOSED_TWO_FIELD_ENERGY_EXCHANGE_20261119/homogeneous/exchange.py'
      - 'research/HDBLAST_CLOSED_TWO_FIELD_ENERGY_EXCHANGE_20261119/homogeneous/results.json'
      - 'research/HDBLAST_CLOSED_TWO_FIELD_ENERGY_EXCHANGE_20261119/prior/dynamic/spectator.py'
      - 'research/HDBLAST_CLOSED_TWO_FIELD_ENERGY_EXCHANGE_20261119/prior/gravity/evolution/evolve.py'
      - 'research/HDBLAST_CLOSED_TWO_FIELD_ENERGY_EXCHANGE_20261119/prior/gravity/initial/constraint.py'
      - 'research/HDBLAST_CLOSED_TWO_FIELD_ENERGY_EXCHANGE_20261119/prior/gravity/previous/nonlinear/nonlinear.py'
      - 'research/HDBLAST_CLOSED_TWO_FIELD_ENERGY_EXCHANGE_20261119/prior/gravity/previous/prior/archive/BLAST_REHEATING_RESULTS.json'
      - 'research/HDBLAST_CLOSED_TWO_FIELD_ENERGY_EXCHANGE_20261119/prior/gravity/previous/prior/archive/blast_common.py'
      - 'research/HDBLAST_CLOSED_TWO_FIELD_ENERGY_EXCHANGE_20261119/prior/gravity/previous/prior/background/background.py'
      - 'research/HDBLAST_CLOSED_TWO_FIELD_ENERGY_EXCHANGE_20261119/prior/gravity/previous/prior/curvature/curvature.py'
      - 'research/HDBLAST_CLOSED_TWO_FIELD_ENERGY_EXCHANGE_20261119/prior/gravity/previous/prior/hilltop/HILLTOP.json'
      - 'research/HDBLAST_CLOSED_TWO_FIELD_ENERGY_EXCHANGE_20261119/prior/gravity/previous/prior/hilltop/check.py'
      - 'research/HDBLAST_CLOSED_TWO_FIELD_ENERGY_EXCHANGE_20261119/prior/gravity/previous/prior/hilltop/hilltop.py'
      - 'research/HDBLAST_CLOSED_TWO_FIELD_ENERGY_EXCHANGE_20261119/prior/intrinsic/frequencies.py'
      - 'research/HDBLAST_CLOSED_TWO_FIELD_ENERGY_EXCHANGE_20261119/prior/passage/PASSAGE.json'
      - 'research/HDBLAST_CLOSED_TWO_FIELD_ENERGY_EXCHANGE_20261119/prior/passage/passage.py'
  push:
    branches: [main]
    paths:
      - 'research/HDBLAST_SMEARED_QUANTUM_STATES_20261119/**'
      - '.github/workflows/smeared-quantum-states.yml'
      - 'research/HDBLAST_CLOSED_TWO_FIELD_ENERGY_EXCHANGE_20261119/checks/phase_work.py'
      - 'research/HDBLAST_CLOSED_TWO_FIELD_ENERGY_EXCHANGE_20261119/homogeneous/exchange.py'
      - 'research/HDBLAST_CLOSED_TWO_FIELD_ENERGY_EXCHANGE_20261119/homogeneous/results.json'
      - 'research/HDBLAST_CLOSED_TWO_FIELD_ENERGY_EXCHANGE_20261119/prior/dynamic/spectator.py'
      - 'research/HDBLAST_CLOSED_TWO_FIELD_ENERGY_EXCHANGE_20261119/prior/gravity/evolution/evolve.py'
      - 'research/HDBLAST_CLOSED_TWO_FIELD_ENERGY_EXCHANGE_20261119/prior/gravity/initial/constraint.py'
      - 'research/HDBLAST_CLOSED_TWO_FIELD_ENERGY_EXCHANGE_20261119/prior/gravity/previous/nonlinear/nonlinear.py'
      - 'research/HDBLAST_CLOSED_TWO_FIELD_ENERGY_EXCHANGE_20261119/prior/gravity/previous/prior/archive/BLAST_REHEATING_RESULTS.json'
      - 'research/HDBLAST_CLOSED_TWO_FIELD_ENERGY_EXCHANGE_20261119/prior/gravity/previous/prior/archive/blast_common.py'
      - 'research/HDBLAST_CLOSED_TWO_FIELD_ENERGY_EXCHANGE_20261119/prior/gravity/previous/prior/background/background.py'
      - 'research/HDBLAST_CLOSED_TWO_FIELD_ENERGY_EXCHANGE_20261119/prior/gravity/previous/prior/curvature/curvature.py'
      - 'research/HDBLAST_CLOSED_TWO_FIELD_ENERGY_EXCHANGE_20261119/prior/gravity/previous/prior/hilltop/HILLTOP.json'
      - 'research/HDBLAST_CLOSED_TWO_FIELD_ENERGY_EXCHANGE_20261119/prior/gravity/previous/prior/hilltop/check.py'
      - 'research/HDBLAST_CLOSED_TWO_FIELD_ENERGY_EXCHANGE_20261119/prior/gravity/previous/prior/hilltop/hilltop.py'
      - 'research/HDBLAST_CLOSED_TWO_FIELD_ENERGY_EXCHANGE_20261119/prior/intrinsic/frequencies.py'
      - 'research/HDBLAST_CLOSED_TWO_FIELD_ENERGY_EXCHANGE_20261119/prior/passage/PASSAGE.json'
      - 'research/HDBLAST_CLOSED_TWO_FIELD_ENERGY_EXCHANGE_20261119/prior/passage/passage.py'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  reproduce:
    name: Reproduce the quantum-state preparations
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: research/HDBLAST_SMEARED_QUANTUM_STATES_20261119
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/HDBLAST_SMEARED_QUANTUM_STATES_20261119/
            /research/HDBLAST_CLOSED_TWO_FIELD_ENERGY_EXCHANGE_20261119/checks/phase_work.py
            /research/HDBLAST_CLOSED_TWO_FIELD_ENERGY_EXCHANGE_20261119/homogeneous/exchange.py
            /research/HDBLAST_CLOSED_TWO_FIELD_ENERGY_EXCHANGE_20261119/homogeneous/results.json
            /research/HDBLAST_CLOSED_TWO_FIELD_ENERGY_EXCHANGE_20261119/prior/dynamic/spectator.py
            /research/HDBLAST_CLOSED_TWO_FIELD_ENERGY_EXCHANGE_20261119/prior/gravity/evolution/evolve.py
            /research/HDBLAST_CLOSED_TWO_FIELD_ENERGY_EXCHANGE_20261119/prior/gravity/initial/constraint.py
            /research/HDBLAST_CLOSED_TWO_FIELD_ENERGY_EXCHANGE_20261119/prior/gravity/previous/nonlinear/nonlinear.py
            /research/HDBLAST_CLOSED_TWO_FIELD_ENERGY_EXCHANGE_20261119/prior/gravity/previous/prior/archive/BLAST_REHEATING_RESULTS.json
            /research/HDBLAST_CLOSED_TWO_FIELD_ENERGY_EXCHANGE_20261119/prior/gravity/previous/prior/archive/blast_common.py
            /research/HDBLAST_CLOSED_TWO_FIELD_ENERGY_EXCHANGE_20261119/prior/gravity/previous/prior/background/background.py
            /research/HDBLAST_CLOSED_TWO_FIELD_ENERGY_EXCHANGE_20261119/prior/gravity/previous/prior/curvature/curvature.py
            /research/HDBLAST_CLOSED_TWO_FIELD_ENERGY_EXCHANGE_20261119/prior/gravity/previous/prior/hilltop/HILLTOP.json
            /research/HDBLAST_CLOSED_TWO_FIELD_ENERGY_EXCHANGE_20261119/prior/gravity/previous/prior/hilltop/check.py
            /research/HDBLAST_CLOSED_TWO_FIELD_ENERGY_EXCHANGE_20261119/prior/gravity/previous/prior/hilltop/hilltop.py
            /research/HDBLAST_CLOSED_TWO_FIELD_ENERGY_EXCHANGE_20261119/prior/intrinsic/frequencies.py
            /research/HDBLAST_CLOSED_TWO_FIELD_ENERGY_EXCHANGE_20261119/prior/passage/PASSAGE.json
            /research/HDBLAST_CLOSED_TWO_FIELD_ENERGY_EXCHANGE_20261119/prior/passage/passage.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the archive and its historical inputs
        run: |
          echo 'a04a00d231b8f9d49c0d6a2685d5a994c74c5d471d944346ad40e21a78cef4e9  SHA256SUMS' | sha256sum -c -
          python -I -B -S reproduce.py
          python -I -B -S - <<'PYTHON'
          import json
          from pathlib import Path
          root = Path.cwd().parents[1]
          for record in json.loads(Path("SOURCES.json").read_text())["sources"]:
              if (root / record["path"]).read_bytes() != Path(record["bundled"]).read_bytes():
                  raise ValueError("Historical input differs from its repository path: " + record["path"])
          PYTHON
      - name: Regenerate the numerical results
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python -m pip install numpy==2.3.5 scipy==1.17.0
          python -I -B reproduce.py --verify --jobs 2
