name: Nonlinear observable budgets replay
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/HDBLAST_NONLINEAR_OBSERVABLE_BUDGETS_20261105/**'
      - '.github/workflows/nonlinear-observable-budgets-20261105.yml'
  push:
    branches: [main]
    paths:
      - 'research/HDBLAST_NONLINEAR_OBSERVABLE_BUDGETS_20261105/**'
      - '.github/workflows/nonlinear-observable-budgets-20261105.yml'
permissions:
  contents: read
jobs:
  nonlinear-observable-budgets:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Replay geometry, odd remainder and observer algebra in both Python modes
        run: python -I -S -B research/HDBLAST_NONLINEAR_OBSERVABLE_BUDGETS_20261105/checks/run_checkpoint.py --manifest-sha256 f910973fbb3fcc88660892f70fe92f50a23d57dd27d62e7626f82a7e8f26a541 --output-dir "$RUNNER_TEMP/nonlinear-observable-budgets-fresh"
      - name: Verify six source or CLI rejections and two authentication controls
        run: python -I -S -B research/HDBLAST_NONLINEAR_OBSERVABLE_BUDGETS_20261105/checks/run_controls.py --manifest-sha256 f910973fbb3fcc88660892f70fe92f50a23d57dd27d62e7626f82a7e8f26a541 --output-dir "$RUNNER_TEMP/nonlinear-observable-budgets-controls-fresh"
