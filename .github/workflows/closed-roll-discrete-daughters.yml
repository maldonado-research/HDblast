name: Closed scalar crossing and discrete daughters
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/HDBLAST_CLOSED_ROLL_AND_DISCRETE_DAUGHTERS_20261119/**'
      - '.github/workflows/closed-roll-discrete-daughters.yml'
      - 'research/HDBLAST_INHOMOGENEOUS_CLOSED_GRAVITY_20261119/evolution/evolve.py'
      - 'research/HDBLAST_INHOMOGENEOUS_CLOSED_GRAVITY_20261119/evolution/results.json'
      - 'research/HDBLAST_INHOMOGENEOUS_CLOSED_GRAVITY_20261119/initial/constraint.py'
      - 'research/HDBLAST_INHOMOGENEOUS_CLOSED_GRAVITY_20261119/previous/nonlinear/nonlinear.py'
      - 'research/HDBLAST_INHOMOGENEOUS_CLOSED_GRAVITY_20261119/previous/prior/archive/BLAST_REHEATING_RESULTS.json'
      - 'research/HDBLAST_INHOMOGENEOUS_CLOSED_GRAVITY_20261119/previous/prior/archive/blast_common.py'
      - 'research/HDBLAST_INHOMOGENEOUS_CLOSED_GRAVITY_20261119/previous/prior/background/background.py'
      - 'research/HDBLAST_INHOMOGENEOUS_CLOSED_GRAVITY_20261119/previous/prior/curvature/curvature.py'
      - 'research/HDBLAST_INHOMOGENEOUS_CLOSED_GRAVITY_20261119/previous/prior/hilltop/HILLTOP.json'
      - 'research/HDBLAST_INHOMOGENEOUS_CLOSED_GRAVITY_20261119/previous/prior/hilltop/check.py'
      - 'research/HDBLAST_INHOMOGENEOUS_CLOSED_GRAVITY_20261119/previous/prior/hilltop/hilltop.py'
      - 'research/HDBLAST_OSCILLATING_MODULUS_20261119/background/BACKGROUND.json'
      - 'research/HDBLAST_OSCILLATING_MODULUS_20261119/widths/WIDTHS.json'
  push:
    branches: [main]
    paths:
      - 'research/HDBLAST_CLOSED_ROLL_AND_DISCRETE_DAUGHTERS_20261119/**'
      - '.github/workflows/closed-roll-discrete-daughters.yml'
      - 'research/HDBLAST_INHOMOGENEOUS_CLOSED_GRAVITY_20261119/evolution/evolve.py'
      - 'research/HDBLAST_INHOMOGENEOUS_CLOSED_GRAVITY_20261119/evolution/results.json'
      - 'research/HDBLAST_INHOMOGENEOUS_CLOSED_GRAVITY_20261119/initial/constraint.py'
      - 'research/HDBLAST_INHOMOGENEOUS_CLOSED_GRAVITY_20261119/previous/nonlinear/nonlinear.py'
      - 'research/HDBLAST_INHOMOGENEOUS_CLOSED_GRAVITY_20261119/previous/prior/archive/BLAST_REHEATING_RESULTS.json'
      - 'research/HDBLAST_INHOMOGENEOUS_CLOSED_GRAVITY_20261119/previous/prior/archive/blast_common.py'
      - 'research/HDBLAST_INHOMOGENEOUS_CLOSED_GRAVITY_20261119/previous/prior/background/background.py'
      - 'research/HDBLAST_INHOMOGENEOUS_CLOSED_GRAVITY_20261119/previous/prior/curvature/curvature.py'
      - 'research/HDBLAST_INHOMOGENEOUS_CLOSED_GRAVITY_20261119/previous/prior/hilltop/HILLTOP.json'
      - 'research/HDBLAST_INHOMOGENEOUS_CLOSED_GRAVITY_20261119/previous/prior/hilltop/check.py'
      - 'research/HDBLAST_INHOMOGENEOUS_CLOSED_GRAVITY_20261119/previous/prior/hilltop/hilltop.py'
      - 'research/HDBLAST_OSCILLATING_MODULUS_20261119/background/BACKGROUND.json'
      - 'research/HDBLAST_OSCILLATING_MODULUS_20261119/widths/WIDTHS.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    name: Replay closed crossings and daughter modes
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: research/HDBLAST_CLOSED_ROLL_AND_DISCRETE_DAUGHTERS_20261119
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/HDBLAST_CLOSED_ROLL_AND_DISCRETE_DAUGHTERS_20261119/
            /research/HDBLAST_INHOMOGENEOUS_CLOSED_GRAVITY_20261119/evolution/evolve.py
            /research/HDBLAST_INHOMOGENEOUS_CLOSED_GRAVITY_20261119/evolution/results.json
            /research/HDBLAST_INHOMOGENEOUS_CLOSED_GRAVITY_20261119/initial/constraint.py
            /research/HDBLAST_INHOMOGENEOUS_CLOSED_GRAVITY_20261119/previous/nonlinear/nonlinear.py
            /research/HDBLAST_INHOMOGENEOUS_CLOSED_GRAVITY_20261119/previous/prior/archive/BLAST_REHEATING_RESULTS.json
            /research/HDBLAST_INHOMOGENEOUS_CLOSED_GRAVITY_20261119/previous/prior/archive/blast_common.py
            /research/HDBLAST_INHOMOGENEOUS_CLOSED_GRAVITY_20261119/previous/prior/background/background.py
            /research/HDBLAST_INHOMOGENEOUS_CLOSED_GRAVITY_20261119/previous/prior/curvature/curvature.py
            /research/HDBLAST_INHOMOGENEOUS_CLOSED_GRAVITY_20261119/previous/prior/hilltop/HILLTOP.json
            /research/HDBLAST_INHOMOGENEOUS_CLOSED_GRAVITY_20261119/previous/prior/hilltop/check.py
            /research/HDBLAST_INHOMOGENEOUS_CLOSED_GRAVITY_20261119/previous/prior/hilltop/hilltop.py
            /research/HDBLAST_OSCILLATING_MODULUS_20261119/background/BACKGROUND.json
            /research/HDBLAST_OSCILLATING_MODULUS_20261119/widths/WIDTHS.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify study and historical inputs
        run: |
          echo 'fdfa9b2f8f2cd27cfd54780d59e5b0c43e2389fcc3b1e3bd29419a651500d1d5  SHA256SUMS' | sha256sum -c -
          python -I -B -S reproduce.py
          python -c "import json, pathlib; s=pathlib.Path('.'); root=s.resolve().parents[1]; pins=json.loads((s/'SOURCES.json').read_text()); assert all((s/p['bundled']).read_bytes()==(root/p['path']).read_bytes() for p in pins['sources'])"
      - name: Replay the scientific experiments
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python -m pip install numpy==2.3.5 scipy==1.17.0
          python -I -B reproduce.py --verify --jobs 2
