name: Past characteristic precursor replay
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/HDBLAST_PAST_CHARACTERISTIC_PRECURSOR_20261105/**'
      - '.github/workflows/past-characteristic-precursor-20261105.yml'
  push:
    branches: [main]
    paths:
      - 'research/HDBLAST_PAST_CHARACTERISTIC_PRECURSOR_20261105/**'
      - '.github/workflows/past-characteristic-precursor-20261105.yml'
permissions:
  contents: read
jobs:
  past-characteristic-precursor:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Reproduce three arithmetic pairs and the manuscript display audit
        run: python -I -S -B research/HDBLAST_PAST_CHARACTERISTIC_PRECURSOR_20261105/checks/run_checkpoint.py --manifest-sha256 98dc0cb01347d3719fa4a025890b6be627ed6f8e030acd0e3c24b231def988fd --output-dir "$RUNNER_TEMP/past-characteristic-precursor-fresh"
      - name: Check six source or CLI rejections and two authentication controls
        run: python -I -S -B research/HDBLAST_PAST_CHARACTERISTIC_PRECURSOR_20261105/checks/run_controls.py --manifest-sha256 98dc0cb01347d3719fa4a025890b6be627ed6f8e030acd0e3c24b231def988fd --output-dir "$RUNNER_TEMP/past-characteristic-precursor-controls-fresh"
