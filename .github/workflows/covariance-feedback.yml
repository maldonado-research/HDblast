name: Gaussian covariance feedback on the shell
on:
  push:
    paths:
      - 'research/HDBLAST_COVARIANCE_FEEDBACK_20261119/**'
      - '.github/workflows/covariance-feedback.yml'
  pull_request:
    paths:
      - 'research/HDBLAST_COVARIANCE_FEEDBACK_20261119/**'
      - '.github/workflows/covariance-feedback.yml'
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        physics: [matter-and-probe, bulk-and-shell]
    name: Replay ${{ matrix.physics }}
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/HDBLAST_COVARIANCE_FEEDBACK_20261119
            research/HDBLAST_CHECKPOINT_20260927/mechanisms/pilot_5d
            research/HDBLAST_CHECKPOINT_20260930/B1_derived_chi_source
            research/HDBLAST_MATCHED_PARENT_SOURCES_20261119/source_check
            research/HDBLAST_MOVING_PARENT_20261119/independent
            research/HDBLAST_PULSE_PARTICLE_RESPONSE_20261118/classical
            research/HDBLAST_SOURCE_WORK_20261118/coupled
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Authenticate archived trajectories and recompute shell and probe evolution
        working-directory: research/HDBLAST_COVARIANCE_FEEDBACK_20261119
        run: |
          echo '153cede5872a092c3216f8aeeabf4c57b6f11b87cd18ad980ec065aae5cd525e  SHA256SUMS' | sha256sum -c -
          sha256sum --quiet -c SHA256SUMS
          python -I -B -S -O reproduce.py
          python -m pip install numpy==2.3.5 scipy==1.17.0
      - name: Recompute the matter diagnostics and both pair solvers
        if: matrix.physics == 'matter-and-probe'
        working-directory: research/HDBLAST_COVARIANCE_FEEDBACK_20261119
        run: python -I -B -O reproduce.py --full
      - name: Recompute the native shell evolutions from their initial inputs
        if: matrix.physics == 'bulk-and-shell'
        working-directory: research/HDBLAST_COVARIANCE_FEEDBACK_20261119
        run: |
          python -I -B -O native/reproduce.py ../.. --full --prefork --jobs 2
          python -I -B -O native_smooth/reproduce.py ../.. --full --jobs 2
