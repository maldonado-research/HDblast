name: Uniform nonlinear completed Cauchy data replay
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/HDBLAST_UNIFORM_CAUCHY_DATA_20261113/**'
      - '.github/workflows/uniform-cauchy-data-20261113.yml'
  push:
    branches: [main]
    paths:
      - 'research/HDBLAST_UNIFORM_CAUCHY_DATA_20261113/**'
      - '.github/workflows/uniform-cauchy-data-20261113.yml'
permissions:
  contents: read
jobs:
  uniform-cauchy-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Install exact hash-pinned algebra wheels
        run: |
          python -m venv "$RUNNER_TEMP/uniform-cauchy-env"
          "$RUNNER_TEMP/uniform-cauchy-env/bin/python" -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r research/HDBLAST_UNIFORM_CAUCHY_DATA_20261113/requirements-checks.txt
      - name: Replay the authenticated canonical, chart-chain and uniform Cauchy ledgers in both modes
        run: |
          "$RUNNER_TEMP/uniform-cauchy-env/bin/python" -I -B research/HDBLAST_UNIFORM_CAUCHY_DATA_20261113/checks/check_checkpoint.py --manifest-sha256 e297d2138fcbff9b6a5126efb7f777e0a74b44dbabddea48cb524240b8082f1b --output "$RUNNER_TEMP/uniform-cauchy-normal.json"
          "$RUNNER_TEMP/uniform-cauchy-env/bin/python" -O -I -B research/HDBLAST_UNIFORM_CAUCHY_DATA_20261113/checks/check_checkpoint.py --manifest-sha256 e297d2138fcbff9b6a5126efb7f777e0a74b44dbabddea48cb524240b8082f1b --output "$RUNNER_TEMP/uniform-cauchy-optimized.json"
          cmp "$RUNNER_TEMP/uniform-cauchy-normal.json" "$RUNNER_TEMP/uniform-cauchy-optimized.json"
      - name: Reject protocol faults and freshly rehashed mathematical faults
        run: |
          "$RUNNER_TEMP/uniform-cauchy-env/bin/python" -I -B research/HDBLAST_UNIFORM_CAUCHY_DATA_20261113/checks/run_controls.py --manifest-sha256 e297d2138fcbff9b6a5126efb7f777e0a74b44dbabddea48cb524240b8082f1b --output-dir "$RUNNER_TEMP/uniform-cauchy-auth-fresh"
          "$RUNNER_TEMP/uniform-cauchy-env/bin/python" -I -B research/HDBLAST_UNIFORM_CAUCHY_DATA_20261113/checks/run_math_controls.py --manifest-sha256 e297d2138fcbff9b6a5126efb7f777e0a74b44dbabddea48cb524240b8082f1b --output-dir "$RUNNER_TEMP/uniform-cauchy-math-fresh"
