name: Hot expansion after a single inward pulse
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/HDBLAST_HOT_EXPANSION_20261120/**'
      - '.github/workflows/hot-expansion.yml'
      - 'research/HDBLAST_NEUTRAL_PARENT_DECAY_20261120/coupled/DECAY.json'
      - 'research/HDBLAST_NEUTRAL_PARENT_DECAY_20261120/coupled/decay.py'
      - 'research/HDBLAST_NEUTRAL_PARENT_DECAY_20261120/coupled/decay_forward.cpp'
  push:
    branches: [main]
    paths:
      - 'research/HDBLAST_HOT_EXPANSION_20261120/**'
      - '.github/workflows/hot-expansion.yml'
      - 'research/HDBLAST_NEUTRAL_PARENT_DECAY_20261120/coupled/DECAY.json'
      - 'research/HDBLAST_NEUTRAL_PARENT_DECAY_20261120/coupled/decay.py'
      - 'research/HDBLAST_NEUTRAL_PARENT_DECAY_20261120/coupled/decay_forward.cpp'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  replay:
    name: Reproduce the pulse, curvature and continuous hot-radius tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: research/HDBLAST_HOT_EXPANSION_20261120
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/HDBLAST_HOT_EXPANSION_20261120/
            /research/HDBLAST_NEUTRAL_PARENT_DECAY_20261120/coupled/DECAY.json
            /research/HDBLAST_NEUTRAL_PARENT_DECAY_20261120/coupled/decay.py
            /research/HDBLAST_NEUTRAL_PARENT_DECAY_20261120/coupled/decay_forward.cpp
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare the archived decay source with the preceding study
        run: |
          cmp prior/DECAY.json ../HDBLAST_NEUTRAL_PARENT_DECAY_20261120/coupled/DECAY.json
          cmp prior/decay.py ../HDBLAST_NEUTRAL_PARENT_DECAY_20261120/coupled/decay.py
          cmp prior/decay_forward.cpp ../HDBLAST_NEUTRAL_PARENT_DECAY_20261120/coupled/decay_forward.cpp
      - name: Verify the release files and pinned inputs
        run: |
          echo 'cd82943f9e6d1d4e6d4f87926f47fbf4a28cc5fddde49da9a6518f4c7995fd90  SHA256SUMS' | sha256sum -c -
          python -I -B -S study.py
      - name: Run the numerical calculations and their controls
        run: |
          python -m pip install numpy==2.3.5 scipy==1.17.0
          python -I -B study.py --verify --output-dir "$RUNNER_TEMP/growth-replay"
