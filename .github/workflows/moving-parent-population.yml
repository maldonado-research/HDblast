name: Moving parent populations and fermion pairs
on:
  push:
    paths:
      - 'research/HDBLAST_MOVING_PARENT_20261119/**'
      - '.github/workflows/moving-parent-population.yml'
  pull_request:
    paths:
      - 'research/HDBLAST_MOVING_PARENT_20261119/**'
      - '.github/workflows/moving-parent-population.yml'
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/HDBLAST_MOVING_PARENT_20261119
            research/HDBLAST_TAGGED_PARENT_20261119/primary
            research/HDBLAST_SOURCE_WORK_20261118/coupled
            research/HDBLAST_PULSE_PARTICLE_RESPONSE_20261118/classical/runs
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the source histories and reproduce the population and phase comparisons
        working-directory: research/HDBLAST_MOVING_PARENT_20261119
        run: |
          echo 'a2281d51980e0e1fb9ca60155a516991ee3baaef6bd36114bfcd54a567e819ad  SHA256SUMS' | sha256sum -c -
          sha256sum --quiet -c SHA256SUMS
          python -m pip install numpy==2.3.5 scipy==1.17.0
          python -I -B reproduce.py
          python -I -B -O reproduce.py --full
