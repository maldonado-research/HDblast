name: Variable-coefficient energy and smooth Picard bound replay
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/HDBLAST_VARIABLE_COEFFICIENT_ENERGY_20261114/**'
      - '.github/workflows/variable-coefficient-energy-20261114.yml'
  push:
    branches: [main]
    paths:
      - 'research/HDBLAST_VARIABLE_COEFFICIENT_ENERGY_20261114/**'
      - '.github/workflows/variable-coefficient-energy-20261114.yml'
permissions:
  contents: read
jobs:
  variable-energy-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Install exact hash-pinned algebra wheels
        run: |
          python -m venv "$RUNNER_TEMP/variable-energy-env"
          "$RUNNER_TEMP/variable-energy-env/bin/python" -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r research/HDBLAST_VARIABLE_COEFFICIENT_ENERGY_20261114/requirements-checks.txt
      - name: Replay the authenticated energy, normal recovery and admission ledgers in both modes
        run: |
          "$RUNNER_TEMP/variable-energy-env/bin/python" -I -B research/HDBLAST_VARIABLE_COEFFICIENT_ENERGY_20261114/checks/check_checkpoint.py --manifest-sha256 479fd32ce950b3321292c6980987cb0bd304c77a01aa17f5536e0d32bb07d46b --output "$RUNNER_TEMP/variable-energy-normal.json"
          "$RUNNER_TEMP/variable-energy-env/bin/python" -O -I -B research/HDBLAST_VARIABLE_COEFFICIENT_ENERGY_20261114/checks/check_checkpoint.py --manifest-sha256 479fd32ce950b3321292c6980987cb0bd304c77a01aa17f5536e0d32bb07d46b --output "$RUNNER_TEMP/variable-energy-optimized.json"
          cmp "$RUNNER_TEMP/variable-energy-normal.json" "$RUNNER_TEMP/variable-energy-optimized.json"
      - name: Reject protocol faults and freshly rehashed mathematical faults
        run: |
          "$RUNNER_TEMP/variable-energy-env/bin/python" -I -B research/HDBLAST_VARIABLE_COEFFICIENT_ENERGY_20261114/checks/run_controls.py --manifest-sha256 479fd32ce950b3321292c6980987cb0bd304c77a01aa17f5536e0d32bb07d46b --output-dir "$RUNNER_TEMP/variable-energy-auth-fresh"
          "$RUNNER_TEMP/variable-energy-env/bin/python" -O -I -B research/HDBLAST_VARIABLE_COEFFICIENT_ENERGY_20261114/checks/run_math_controls.py --manifest-sha256 479fd32ce950b3321292c6980987cb0bd304c77a01aa17f5536e0d32bb07d46b --output-dir "$RUNNER_TEMP/variable-energy-math-fresh"
