name: Transverse fields on the HDblast wall
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'research/HDBLAST_TRANSVERSE_RESPONSE_20261121/**'
      - '.github/workflows/transverse-response.yml'
  push:
    branches: [main]
    paths:
      - 'research/HDBLAST_TRANSVERSE_RESPONSE_20261121/**'
      - '.github/workflows/transverse-response.yml'

permissions:
  contents: read

jobs:
  replay:
    name: Regenerate particle histories and transverse response
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    defaults:
      run:
        working-directory: research/HDBLAST_TRANSVERSE_RESPONSE_20261121
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: /research/HDBLAST_TRANSVERSE_RESPONSE_20261121/
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify archived sources and predecessor inputs
        run: |
          echo '9ce9e06b5574bf7d7c90cfc4fbedb4dd59c70311526e42652e19a31c137e6583  SHA256SUMS' | sha256sum -c -
          python -I -B -S study.py
      - name: Reproduce the calculations
        run: |
          python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
          python -I -B study.py --verify --output-dir "$RUNNER_TEMP/transverse-results"
      - name: Retain numerical results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: transverse-results
          path: ${{ runner.temp }}/transverse-results/
          if-no-files-found: ignore
          retention-days: 14
