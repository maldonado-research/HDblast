name: Proper second scalar curvature and area replay
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/HDBLAST_PROPER_SECOND_GEOMETRY_20261113/**'
      - '.github/workflows/proper-second-geometry-20261113.yml'
  push:
    branches: [main]
    paths:
      - 'research/HDBLAST_PROPER_SECOND_GEOMETRY_20261113/**'
      - '.github/workflows/proper-second-geometry-20261113.yml'
permissions:
  contents: read
jobs:
  proper-second-geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Install exact hash-pinned algebra wheels in a separate environment
        run: |
          python -m venv "$RUNNER_TEMP/proper-geometry-env"
          "$RUNNER_TEMP/proper-geometry-env/bin/python" -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r research/HDBLAST_PROPER_SECOND_GEOMETRY_20261113/requirements-checks.txt
      - name: Replay the authenticated source algebra and rational ledger in both modes
        run: |
          "$RUNNER_TEMP/proper-geometry-env/bin/python" -I -B research/HDBLAST_PROPER_SECOND_GEOMETRY_20261113/checks/check_checkpoint.py --manifest-sha256 c046228bb323b01f712f0d41d44df26af0fe3db2970273e5a1d5d28d3fe4344b --output "$RUNNER_TEMP/proper-geometry-normal.json"
          "$RUNNER_TEMP/proper-geometry-env/bin/python" -O -I -B research/HDBLAST_PROPER_SECOND_GEOMETRY_20261113/checks/check_checkpoint.py --manifest-sha256 c046228bb323b01f712f0d41d44df26af0fe3db2970273e5a1d5d28d3fe4344b --output "$RUNNER_TEMP/proper-geometry-optimized.json"
          cmp "$RUNNER_TEMP/proper-geometry-normal.json" "$RUNNER_TEMP/proper-geometry-optimized.json"
      - name: Reject five authentication faults and eight refreshed mathematical faults
        run: '"$RUNNER_TEMP/proper-geometry-env/bin/python" -I -B research/HDBLAST_PROPER_SECOND_GEOMETRY_20261113/checks/run_controls.py --manifest-sha256 c046228bb323b01f712f0d41d44df26af0fe3db2970273e5a1d5d28d3fe4344b --output-dir "$RUNNER_TEMP/proper-geometry-controls-fresh"'
