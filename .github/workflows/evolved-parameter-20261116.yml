name: Actual evolved parameter derivative replay
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/HDBLAST_EVOLVED_PARAMETER_20261116/**'
      - '.github/workflows/evolved-parameter-20261116.yml'
  push:
    branches: [main]
    paths:
      - 'research/HDBLAST_EVOLVED_PARAMETER_20261116/**'
      - '.github/workflows/evolved-parameter-20261116.yml'
permissions:
  contents: read
jobs:
  evolved-parameter-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Install exact hash-pinned algebra wheels
        run: |
          python -m venv "$RUNNER_TEMP/evolved-parameter-env"
          "$RUNNER_TEMP/evolved-parameter-env/bin/python" -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r research/HDBLAST_EVOLVED_PARAMETER_20261116/requirements-checks.txt
      - name: Replay the authenticated source and parameter algebra interfaces in both modes
        run: |
          "$RUNNER_TEMP/evolved-parameter-env/bin/python" -I -B research/HDBLAST_EVOLVED_PARAMETER_20261116/checks/check_checkpoint.py --manifest-sha256 1eb6e5e987d8ca2de7ab82661f18bdbd094aa53cbb03cea20d1335352c0c6326 --output "$RUNNER_TEMP/evolved-parameter-normal.json"
          "$RUNNER_TEMP/evolved-parameter-env/bin/python" -O -I -B research/HDBLAST_EVOLVED_PARAMETER_20261116/checks/check_checkpoint.py --manifest-sha256 1eb6e5e987d8ca2de7ab82661f18bdbd094aa53cbb03cea20d1335352c0c6326 --output "$RUNNER_TEMP/evolved-parameter-optimized.json"
          cmp "$RUNNER_TEMP/evolved-parameter-normal.json" "$RUNNER_TEMP/evolved-parameter-optimized.json"
      - name: Reject protocol faults and freshly rehashed mathematical faults
        run: |
          "$RUNNER_TEMP/evolved-parameter-env/bin/python" -I -B research/HDBLAST_EVOLVED_PARAMETER_20261116/checks/run_controls.py --manifest-sha256 1eb6e5e987d8ca2de7ab82661f18bdbd094aa53cbb03cea20d1335352c0c6326 --output-dir "$RUNNER_TEMP/evolved-parameter-auth-fresh"
          "$RUNNER_TEMP/evolved-parameter-env/bin/python" -O -I -B research/HDBLAST_EVOLVED_PARAMETER_20261116/checks/run_math_controls.py --manifest-sha256 1eb6e5e987d8ca2de7ab82661f18bdbd094aa53cbb03cea20d1335352c0c6326 --output-dir "$RUNNER_TEMP/evolved-parameter-math-fresh"
