name: Finite-band Ward exact mathematical replay

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/HDBLAST_CHECKPOINT_20261005_FINITE_BAND_WARD/**'
      - 'research/HDBLAST_FINITE_BAND_WARD_PACKAGE_20261005/**'
      - '.github/workflows/hdblast_finite_band_ward.yml'
  pull_request:
    paths:
      - 'research/HDBLAST_CHECKPOINT_20261005_FINITE_BAND_WARD/**'
      - 'research/HDBLAST_FINITE_BAND_WARD_PACKAGE_20261005/**'
      - '.github/workflows/hdblast_finite_band_ward.yml'

permissions:
  contents: read

jobs:
  fresh-mathematical-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            research/HDBLAST_CHECKPOINT_20261005_FINITE_BAND_WARD
            research/HDBLAST_FINITE_BAND_WARD_PACKAGE_20261005
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Install the exact symbolic dependencies
        run: |
          python -m pip install --only-binary=:all: -r research/HDBLAST_CHECKPOINT_20261005_FINITE_BAND_WARD/requirements-replay.txt
          python -m pip check
      - name: Validate checkpoint bytes and replay the standalone archive
        run: |
          python -B - <<'PY'
          import importlib.util, json, pathlib
          root = pathlib.Path('research/HDBLAST_CHECKPOINT_20261005_FINITE_BAND_WARD').resolve()
          packet = pathlib.Path('research/HDBLAST_FINITE_BAND_WARD_PACKAGE_20261005')
          manifest_sha = json.loads((packet / 'ARCHIVE.json').read_text())['manifest_sha256']
          spec = importlib.util.spec_from_file_location('finite_band_replay', root / 'execution/replay_checkpoint.py')
          replay = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(replay)
          replay.verify(root, manifest_sha)
          PY
          packet=research/HDBLAST_FINITE_BAND_WARD_PACKAGE_20261005
          python -B "$packet/replay_archive.py" --packet "$packet" \
            --output-directory "$RUNNER_TEMP/finite-band-clean-replay" \
            > "$RUNNER_TEMP/finite-band-replay.stdout.log" \
            2> "$RUNNER_TEMP/finite-band-replay.stderr.log"
      - name: Retain exact proof receipts and execution logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finite-band-exact-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/finite-band-replay.stdout.log
            ${{ runner.temp }}/finite-band-replay.stderr.log
            ${{ runner.temp }}/finite-band-clean-replay/FRESH_REPRODUCTION.json
            ${{ runner.temp }}/finite-band-clean-replay/replay.*.log
            ${{ runner.temp }}/finite-band-clean-replay/proof-runs/
          if-no-files-found: warn
          retention-days: 14
