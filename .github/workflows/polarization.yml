name: Two polarized fields and source energy on the HDblast shell
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'research/HDBLAST_POLARIZATION_20261121/**'
      - '.github/workflows/polarization.yml'
  push:
    branches: [main]
    paths:
      - 'research/HDBLAST_POLARIZATION_20261121/**'
      - '.github/workflows/polarization.yml'

permissions:
  contents: read

jobs:
  replay:
    name: Regenerate the polarized fields, energy exchange and particle response
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    defaults:
      run:
        working-directory: research/HDBLAST_POLARIZATION_20261121
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: /research/HDBLAST_POLARIZATION_20261121/
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify archived sources and predecessor inputs
        run: |
          echo '38c06ac62f996fbfbbd2e106e43c67de2896607500787630c617ef610e42916b  SHA256SUMS' | sha256sum -c -
          python -I -B -S study.py
      - name: Reproduce the calculations
        run: |
          python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
          python -I -B study.py --verify --output-dir "$RUNNER_TEMP/polarization-results"
      - name: Retain numerical results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: polarization-results
          path: |
            ${{ runner.temp }}/polarization-results/**/*.json
          if-no-files-found: ignore
          retention-days: 14
