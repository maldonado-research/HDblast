name: Scalar reservoir and radiation budget
on:
  push:
    paths:
      - 'research/HDBLAST_SCALAR_RESERVOIR_20261118/**'
      - '.github/workflows/scalar-reservoir-budget.yml'
  pull_request:
    paths:
      - 'research/HDBLAST_SCALAR_RESERVOIR_20261118/**'
      - '.github/workflows/scalar-reservoir-budget.yml'
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: research/HDBLAST_SCALAR_RESERVOIR_20261118
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the numerical tables and replay all registered outputs
        working-directory: research/HDBLAST_SCALAR_RESERVOIR_20261118
        run: |
          echo 'bfdfb717321e79b640f73cb1c0df30cf92d02184b14d87d5058307a672bf3fb0  SHA256SUMS' | sha256sum -c -
          sha256sum -c SHA256SUMS
          python -I -B reproduce.py
          python -I -B -O reproduce.py
