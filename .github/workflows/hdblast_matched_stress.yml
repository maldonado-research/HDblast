name: Matched fixed-geometry stress response

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/HDBLAST_CHECKPOINT_20261002_MATCHED_STRESS/**'
      - '.github/workflows/hdblast_matched_stress.yml'
  pull_request:
    paths:
      - 'research/HDBLAST_CHECKPOINT_20261002_MATCHED_STRESS/**'
      - '.github/workflows/hdblast_matched_stress.yml'

permissions:
  contents: read

jobs:
  registered-stress-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONOPTIMIZE: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: research/HDBLAST_CHECKPOINT_20261002_MATCHED_STRESS
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact replay dependencies
        run: |
          python -m pip install --only-binary=:all: -r research/HDBLAST_CHECKPOINT_20261002_MATCHED_STRESS/requirements-replay.txt
      - name: Replay frozen direct stresses and independent validation
        run: |
          python research/HDBLAST_CHECKPOINT_20261002_MATCHED_STRESS/code/replay_stress.py --output "$RUNNER_TEMP/matched-stress-replay"
      - name: Retain actual execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matched-stress-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/matched-stress-replay/
          if-no-files-found: warn
          retention-days: 7
