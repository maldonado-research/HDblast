name: Elastic scattering and encounter rates on the HDblast shell
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'research/HDBLAST_SCATTERING_20261121/**'
      - '.github/workflows/scattering.yml'
  push:
    branches: [main]
    paths:
      - 'research/HDBLAST_SCATTERING_20261121/**'
      - '.github/workflows/scattering.yml'

permissions:
  contents: read

jobs:
  replay:
    name: Regenerate charged populations, collision histories and distribution bounds
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    defaults:
      run:
        working-directory: research/HDBLAST_SCATTERING_20261121
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/HDBLAST_SCATTERING_20261121/
            /research/HDBLAST_POLARIZATION_20261121/
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify study and predecessor inputs
        run: |
          echo 'cff83423b0b81e2bd54ffa353131545b9a2b6acc81246e50776f18853a89a160  SHA256SUMS' | sha256sum -c -
          python -I -B -S study.py
      - name: Reproduce the calculations
        run: |
          python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
          python -I -B study.py --verify --output-dir "$RUNNER_TEMP/scattering-results"
      - name: Retain numerical results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: scattering-results
          path: |
            ${{ runner.temp }}/scattering-results/**/*.json
          if-no-files-found: ignore
          retention-days: 14
