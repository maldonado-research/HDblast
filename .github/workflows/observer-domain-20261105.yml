name: Observer domain replay
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/HDBLAST_OBSERVER_DOMAIN_20261105/**'
      - '.github/workflows/observer-domain-20261105.yml'
  push:
    branches: [main]
    paths:
      - 'research/HDBLAST_OBSERVER_DOMAIN_20261105/**'
      - '.github/workflows/observer-domain-20261105.yml'
permissions:
  contents: read
jobs:
  finite-observer-domain:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Replay embedding, normal-clock and coefficient-bootstrap algebra in both modes
        run: python -I -S -B research/HDBLAST_OBSERVER_DOMAIN_20261105/checks/run_checkpoint.py --manifest-sha256 fa362e80efd34ac9bbf25c5930958c75019c061b1e77a13640dca5c88f8341bc --output-dir "$RUNNER_TEMP/observer-domain-fresh"
      - name: Reject six source or CLI errors and verify two authentication controls
        run: python -I -S -B research/HDBLAST_OBSERVER_DOMAIN_20261105/checks/run_controls.py --manifest-sha256 fa362e80efd34ac9bbf25c5930958c75019c061b1e77a13640dca5c88f8341bc --output-dir "$RUNNER_TEMP/observer-domain-controls-fresh"
