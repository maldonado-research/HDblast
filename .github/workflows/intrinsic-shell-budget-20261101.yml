name: Intrinsic shell geometry and mean budget replay
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/HDBLAST_INTRINSIC_SHELL_BUDGET_20261101/**'
      - '.github/workflows/intrinsic-shell-budget-20261101.yml'
  push:
    branches: [main]
    paths:
      - 'research/HDBLAST_INTRINSIC_SHELL_BUDGET_20261101/**'
      - '.github/workflows/intrinsic-shell-budget-20261101.yml'
permissions:
  contents: read
jobs:
  intrinsic-shell-budget:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Install pinned verification dependencies
        run: python -m pip install -r research/HDBLAST_INTRINSIC_SHELL_BUDGET_20261101/requirements.txt
      - name: Replay intrinsic shell bounds, initial moment and corruption controls
        run: python -I -S -B research/HDBLAST_INTRINSIC_SHELL_BUDGET_20261101/checks/run_checkpoint.py --repo-root . --output-dir "$RUNNER_TEMP/intrinsic-shell-budget-fresh"
