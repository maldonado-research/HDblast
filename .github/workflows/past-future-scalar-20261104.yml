name: Past-future scalar transfer replay
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/HDBLAST_PAST_FUTURE_SCALAR_TRANSFER_20261104/**'
      - '.github/workflows/past-future-scalar-20261104.yml'
  push:
    branches: [main]
    paths:
      - 'research/HDBLAST_PAST_FUTURE_SCALAR_TRANSFER_20261104/**'
      - '.github/workflows/past-future-scalar-20261104.yml'
permissions:
  contents: read
jobs:
  past-future-scalar-transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Reproduce three mathematical pairs and the manuscript display audit
        run: python -I -S -B research/HDBLAST_PAST_FUTURE_SCALAR_TRANSFER_20261104/checks/run_checkpoint.py --manifest-sha256 78484ac9f286e286a6ee3554500b892a3477dda55fa0dfb1fed4ca063f05e628 --output-dir "$RUNNER_TEMP/past-future-scalar-fresh"
      - name: Verify six source or CLI rejections and two authentication controls
        run: python -I -S -B research/HDBLAST_PAST_FUTURE_SCALAR_TRANSFER_20261104/checks/run_controls.py --manifest-sha256 78484ac9f286e286a6ee3554500b892a3477dda55fa0dfb1fed4ca063f05e628 --output-dir "$RUNNER_TEMP/past-future-scalar-controls-fresh"
