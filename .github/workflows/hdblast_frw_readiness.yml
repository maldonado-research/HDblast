name: HDBLAST curved-source readiness
on:
  push:
    branches: ["research/20261002-curved-source-readiness"]
    paths:
      - "research/HDBLAST_CHECKPOINT_20261002_FRW/code/**"
      - "research/HDBLAST_CHECKPOINT_20261002_FRW/REGISTRATION.md"
      - "research/HDBLAST_CHECKPOINT_20261002_FRW/PROTOCOL_ADDENDUM.md"
      - "research/HDBLAST_CHECKPOINT_20261002_FRW/INPUTS.json"
      - "research/HDBLAST_CHECKPOINT_20261002_FRW/HDBLAST_CHECKPOINT_20261002_FRW.zip"
      - ".github/workflows/hdblast_frw_readiness.yml"
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: research/HDBLAST_CHECKPOINT_20261002_FRW
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify prospective protocol and archived inputs
        working-directory: research/HDBLAST_CHECKPOINT_20261002_FRW
        run: |
          python code/verify_package.py HDBLAST_CHECKPOINT_20261002_FRW.zip
          python -m compileall -q code
          python code/verify_protocol.py
          python code/verify_inputs.py
      - name: Install numerical dependencies
        run: python -m pip install numpy==2.2.6 scipy==1.15.3 matplotlib==3.10.1 mpmath==1.3.0
      - name: Exact rational curved-counterterm checks
        working-directory: research/HDBLAST_CHECKPOINT_20261002_FRW
        run: python code/verify_frw_counterterms.py
      - name: Smooth-step DOP853 and exact UV controls
        working-directory: research/HDBLAST_CHECKPOINT_20261002_FRW
        run: python code/smooth_controls.py
      - name: Independent real Radau controls
        working-directory: research/HDBLAST_CHECKPOINT_20261002_FRW
        run: python code/independent_smooth.py
      - name: Audit actual archived geometry and state readiness
        working-directory: research/HDBLAST_CHECKPOINT_20261002_FRW
        run: python code/geometry_audit.py --registration REGISTRATION.md --registration-sha256 939e7f6ad178c32cdcf638d01b8694d2194e805f0aad38964416518e3b72a2b5 --source-ref "${GITHUB_SHA}"
      - name: Descriptive comparisons and smooth-width limit
        working-directory: research/HDBLAST_CHECKPOINT_20261002_FRW
        run: |
          python code/verify_archive_interference.py
          python code/check_reconstruction_fidelity.py
          python code/compare_results.py
          python code/smoothing_limit.py
      - name: Render figures from executed arrays
        working-directory: research/HDBLAST_CHECKPOINT_20261002_FRW
        run: python code/plot_results.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hdblast-curved-readiness
          path: research/HDBLAST_CHECKPOINT_20261002_FRW/outputs/
          if-no-files-found: warn
