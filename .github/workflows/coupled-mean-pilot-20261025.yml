name: Bounded coupled mean and reflected kernel replay
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/HDBLAST_COUPLED_MEAN_PILOT_20261025/**'
      - 'hdblast/continuation/2026.10.25-coupled-mean-pilot/**'
      - '.github/workflows/coupled-mean-pilot-20261025.yml'
  pull_request:
    paths:
      - 'research/HDBLAST_COUPLED_MEAN_PILOT_20261025/**'
      - 'hdblast/continuation/2026.10.25-coupled-mean-pilot/**'
      - '.github/workflows/coupled-mean-pilot-20261025.yml'
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      HDB_MANIFEST: '043a1fb9dff8422844f8629bbbd0065393b93927b9c421bf283fe3b22d55082d'
      HDB_RUNNER: '59abe1b6d1a91fe0bcd3961e81c0614999946815e97c45a11337a38dcb951555'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/HDBLAST_COUPLED_MEAN_PILOT_20261025/
            /research/HDBLAST_INPUT_PRECISION_20261023/
            /research/HDBLAST_COMMON_GAUGE_FORCING_20261016/
            /research/HDBLAST_NUMERICAL_RESPONSE_INPUTS_20261016/
            /research/HDBLAST_GEOMETRIC_BULK_SOURCES_20261016/
            /research/HDBLAST_FORCED_RESPONSE_BOUNDS_20261023/
            /research/HDBLAST_TOTAL_RESPONSE_PREFLIGHT_20261023/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
          check-latest: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          check-latest: false
      - name: Verify source and run both bounded native modes
        shell: bash
        run: |
          set -euo pipefail
          caps="research/HDBLAST_COUPLED_MEAN_PILOT_20261025"
          printf '%s  %s\n' "$HDB_MANIFEST" "$caps/MANIFEST.json" | sha256sum --check --strict
          printf '%s  %s\n' "$HDB_RUNNER" "$caps/reproduce.py" | sha256sum --check --strict
          python -I -S -B "$caps/reproduce.py" --manifest-sha256 "$HDB_MANIFEST" --output-dir "$RUNNER_TEMP/coupled-mean-pilot" --native --repo-root "$GITHUB_WORKSPACE" --export-native-json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coupled-mean-pilot-${{ github.sha }}
          path: ${{ runner.temp }}/coupled-mean-pilot/
          if-no-files-found: warn
          retention-days: 30
