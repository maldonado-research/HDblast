name: Closed two-field energy exchange
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/HDBLAST_CLOSED_TWO_FIELD_ENERGY_EXCHANGE_20261119/**'
      - '.github/workflows/closed-two-field-energy-exchange.yml'
      - 'research/HDBLAST_CLOSED_ROLL_AND_DISCRETE_DAUGHTERS_20261119/dynamic/spectator.py'
      - 'research/HDBLAST_CLOSED_ROLL_AND_DISCRETE_DAUGHTERS_20261119/gravity/evolution/evolve.py'
      - 'research/HDBLAST_CLOSED_ROLL_AND_DISCRETE_DAUGHTERS_20261119/gravity/initial/constraint.py'
      - 'research/HDBLAST_CLOSED_ROLL_AND_DISCRETE_DAUGHTERS_20261119/gravity/previous/nonlinear/nonlinear.py'
      - 'research/HDBLAST_CLOSED_ROLL_AND_DISCRETE_DAUGHTERS_20261119/gravity/previous/prior/archive/BLAST_REHEATING_RESULTS.json'
      - 'research/HDBLAST_CLOSED_ROLL_AND_DISCRETE_DAUGHTERS_20261119/gravity/previous/prior/archive/blast_common.py'
      - 'research/HDBLAST_CLOSED_ROLL_AND_DISCRETE_DAUGHTERS_20261119/gravity/previous/prior/background/background.py'
      - 'research/HDBLAST_CLOSED_ROLL_AND_DISCRETE_DAUGHTERS_20261119/gravity/previous/prior/curvature/curvature.py'
      - 'research/HDBLAST_CLOSED_ROLL_AND_DISCRETE_DAUGHTERS_20261119/gravity/previous/prior/hilltop/HILLTOP.json'
      - 'research/HDBLAST_CLOSED_ROLL_AND_DISCRETE_DAUGHTERS_20261119/gravity/previous/prior/hilltop/check.py'
      - 'research/HDBLAST_CLOSED_ROLL_AND_DISCRETE_DAUGHTERS_20261119/gravity/previous/prior/hilltop/hilltop.py'
      - 'research/HDBLAST_CLOSED_ROLL_AND_DISCRETE_DAUGHTERS_20261119/intrinsic/frequencies.py'
      - 'research/HDBLAST_CLOSED_ROLL_AND_DISCRETE_DAUGHTERS_20261119/passage/PASSAGE.json'
      - 'research/HDBLAST_CLOSED_ROLL_AND_DISCRETE_DAUGHTERS_20261119/passage/passage.py'
      - 'research/HDBLAST_CLOSED_ROLL_AND_DISCRETE_DAUGHTERS_20261119/rollout/ROLLOUT.json'
  push:
    branches: [main]
    paths:
      - 'research/HDBLAST_CLOSED_TWO_FIELD_ENERGY_EXCHANGE_20261119/**'
      - '.github/workflows/closed-two-field-energy-exchange.yml'
      - 'research/HDBLAST_CLOSED_ROLL_AND_DISCRETE_DAUGHTERS_20261119/dynamic/spectator.py'
      - 'research/HDBLAST_CLOSED_ROLL_AND_DISCRETE_DAUGHTERS_20261119/gravity/evolution/evolve.py'
      - 'research/HDBLAST_CLOSED_ROLL_AND_DISCRETE_DAUGHTERS_20261119/gravity/initial/constraint.py'
      - 'research/HDBLAST_CLOSED_ROLL_AND_DISCRETE_DAUGHTERS_20261119/gravity/previous/nonlinear/nonlinear.py'
      - 'research/HDBLAST_CLOSED_ROLL_AND_DISCRETE_DAUGHTERS_20261119/gravity/previous/prior/archive/BLAST_REHEATING_RESULTS.json'
      - 'research/HDBLAST_CLOSED_ROLL_AND_DISCRETE_DAUGHTERS_20261119/gravity/previous/prior/archive/blast_common.py'
      - 'research/HDBLAST_CLOSED_ROLL_AND_DISCRETE_DAUGHTERS_20261119/gravity/previous/prior/background/background.py'
      - 'research/HDBLAST_CLOSED_ROLL_AND_DISCRETE_DAUGHTERS_20261119/gravity/previous/prior/curvature/curvature.py'
      - 'research/HDBLAST_CLOSED_ROLL_AND_DISCRETE_DAUGHTERS_20261119/gravity/previous/prior/hilltop/HILLTOP.json'
      - 'research/HDBLAST_CLOSED_ROLL_AND_DISCRETE_DAUGHTERS_20261119/gravity/previous/prior/hilltop/check.py'
      - 'research/HDBLAST_CLOSED_ROLL_AND_DISCRETE_DAUGHTERS_20261119/gravity/previous/prior/hilltop/hilltop.py'
      - 'research/HDBLAST_CLOSED_ROLL_AND_DISCRETE_DAUGHTERS_20261119/intrinsic/frequencies.py'
      - 'research/HDBLAST_CLOSED_ROLL_AND_DISCRETE_DAUGHTERS_20261119/passage/PASSAGE.json'
      - 'research/HDBLAST_CLOSED_ROLL_AND_DISCRETE_DAUGHTERS_20261119/passage/passage.py'
      - 'research/HDBLAST_CLOSED_ROLL_AND_DISCRETE_DAUGHTERS_20261119/rollout/ROLLOUT.json'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  reproduce:
    name: Reproduce the two-field energy balances
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: research/HDBLAST_CLOSED_TWO_FIELD_ENERGY_EXCHANGE_20261119
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/HDBLAST_CLOSED_TWO_FIELD_ENERGY_EXCHANGE_20261119/
            /research/HDBLAST_CLOSED_ROLL_AND_DISCRETE_DAUGHTERS_20261119/dynamic/spectator.py
            /research/HDBLAST_CLOSED_ROLL_AND_DISCRETE_DAUGHTERS_20261119/gravity/evolution/evolve.py
            /research/HDBLAST_CLOSED_ROLL_AND_DISCRETE_DAUGHTERS_20261119/gravity/initial/constraint.py
            /research/HDBLAST_CLOSED_ROLL_AND_DISCRETE_DAUGHTERS_20261119/gravity/previous/nonlinear/nonlinear.py
            /research/HDBLAST_CLOSED_ROLL_AND_DISCRETE_DAUGHTERS_20261119/gravity/previous/prior/archive/BLAST_REHEATING_RESULTS.json
            /research/HDBLAST_CLOSED_ROLL_AND_DISCRETE_DAUGHTERS_20261119/gravity/previous/prior/archive/blast_common.py
            /research/HDBLAST_CLOSED_ROLL_AND_DISCRETE_DAUGHTERS_20261119/gravity/previous/prior/background/background.py
            /research/HDBLAST_CLOSED_ROLL_AND_DISCRETE_DAUGHTERS_20261119/gravity/previous/prior/curvature/curvature.py
            /research/HDBLAST_CLOSED_ROLL_AND_DISCRETE_DAUGHTERS_20261119/gravity/previous/prior/hilltop/HILLTOP.json
            /research/HDBLAST_CLOSED_ROLL_AND_DISCRETE_DAUGHTERS_20261119/gravity/previous/prior/hilltop/check.py
            /research/HDBLAST_CLOSED_ROLL_AND_DISCRETE_DAUGHTERS_20261119/gravity/previous/prior/hilltop/hilltop.py
            /research/HDBLAST_CLOSED_ROLL_AND_DISCRETE_DAUGHTERS_20261119/intrinsic/frequencies.py
            /research/HDBLAST_CLOSED_ROLL_AND_DISCRETE_DAUGHTERS_20261119/passage/PASSAGE.json
            /research/HDBLAST_CLOSED_ROLL_AND_DISCRETE_DAUGHTERS_20261119/passage/passage.py
            /research/HDBLAST_CLOSED_ROLL_AND_DISCRETE_DAUGHTERS_20261119/rollout/ROLLOUT.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the archive and its historical inputs
        run: |
          echo '40d80a11dcf03f66f57df1bffc51a7f73c6aac22b41616d97d7d23c1428587bf  SHA256SUMS' | sha256sum -c -
          python -I -B -S reproduce.py
          python -I -B -S - <<'PYTHON'
          import json
          from pathlib import Path
          root = Path.cwd().parents[1]
          for record in json.loads(Path("SOURCES.json").read_text())["sources"]:
              if (root / record["path"]).read_bytes() != Path(record["bundled"]).read_bytes():
                  raise ValueError("Historical input differs from its repository path: " + record["path"])
          PYTHON
      - name: Regenerate the numerical results
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python -m pip install numpy==2.3.5 scipy==1.17.0
          python -I -B reproduce.py --verify --jobs 2
