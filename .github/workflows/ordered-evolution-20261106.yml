name: Ordered background and quadratic forcing replay
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/HDBLAST_ORDERED_EVOLUTION_20261106/**'
      - '.github/workflows/ordered-evolution-20261106.yml'
  push:
    branches: [main]
    paths:
      - 'research/HDBLAST_ORDERED_EVOLUTION_20261106/**'
      - '.github/workflows/ordered-evolution-20261106.yml'
permissions:
  contents: read
jobs:
  ordered-evolution:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Replay ordered background and H12 forcing in both modes
        run: |
          python -I -S -B research/HDBLAST_ORDERED_EVOLUTION_20261106/checks/check_checkpoint.py --manifest-sha256 349aac4b73c773ff58ac77900389993f545a02300058b94c676b4b6021d6a0f3 --output "$RUNNER_TEMP/ordered-evolution-normal.json"
          python -O -I -S -B research/HDBLAST_ORDERED_EVOLUTION_20261106/checks/check_checkpoint.py --manifest-sha256 349aac4b73c773ff58ac77900389993f545a02300058b94c676b4b6021d6a0f3 --output "$RUNNER_TEMP/ordered-evolution-optimized.json"
          cmp "$RUNNER_TEMP/ordered-evolution-normal.json" "$RUNNER_TEMP/ordered-evolution-optimized.json"
      - name: Reject seven source, manifest and arithmetic corruptions
        run: python -I -S -B research/HDBLAST_ORDERED_EVOLUTION_20261106/checks/run_controls.py --manifest-sha256 349aac4b73c773ff58ac77900389993f545a02300058b94c676b4b6021d6a0f3 --output-dir "$RUNNER_TEMP/ordered-evolution-controls-fresh"
