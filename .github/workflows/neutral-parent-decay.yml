name: Neutral parent decay into charged matter
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/HDBLAST_NEUTRAL_PARENT_DECAY_20261120/**'
      - '.github/workflows/neutral-parent-decay.yml'
      - 'research/HDBLAST_CHARGED_MATTER_HEATING_20261120/coupled/CHARGED.json'
  push:
    branches: [main]
    paths:
      - 'research/HDBLAST_NEUTRAL_PARENT_DECAY_20261120/**'
      - '.github/workflows/neutral-parent-decay.yml'
      - 'research/HDBLAST_CHARGED_MATTER_HEATING_20261120/coupled/CHARGED.json'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  replay:
    name: Reproduce decay, electromagnetic heating and the microscopic consistency tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: research/HDBLAST_NEUTRAL_PARENT_DECAY_20261120
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/HDBLAST_NEUTRAL_PARENT_DECAY_20261120/
            /research/HDBLAST_CHARGED_MATTER_HEATING_20261120/coupled/CHARGED.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the release files and pinned inputs
        run: |
          echo '7faf534d1373f1e04abb11343e20ac5d847ca9da76fcb50997d65db069cdf3a8  SHA256SUMS' | sha256sum -c -
          cmp prior/CHARGED.json ../HDBLAST_CHARGED_MATTER_HEATING_20261120/coupled/CHARGED.json
          python -I -B -S study.py
      - name: Run the numerical calculations and their controls
        run: |
          python -m pip install numpy==2.3.5 scipy==1.17.0
          python -I -B study.py --verify --output-dir "$RUNNER_TEMP/decay-replay"
