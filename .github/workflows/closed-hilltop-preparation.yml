name: Quantum preparation of the closed hilltop
on:
  pull_request:
    branches: [main]
    paths: &study_paths
      - 'research/HDBLAST_CLOSED_HILLTOP_PREPARATION_20261119/**'
      - '.github/workflows/closed-hilltop-preparation.yml'
      - 'research/HDBLAST_OSCILLATING_MODULUS_20261119/archive/BLAST_REHEATING_RESULTS.json'
      - 'research/HDBLAST_OSCILLATING_MODULUS_20261119/archive/blast_common.py'
      - 'research/HDBLAST_OSCILLATING_MODULUS_20261119/background/background.py'
      - 'research/HDBLAST_OSCILLATING_MODULUS_20261119/curvature/curvature.py'
      - 'research/HDBLAST_OSCILLATING_MODULUS_20261119/hilltop/hilltop.py'
      - 'research/HDBLAST_OSCILLATING_MODULUS_20261119/hilltop/check.py'
      - 'research/HDBLAST_OSCILLATING_MODULUS_20261119/hilltop/HILLTOP.json'
  push:
    branches: [main]
    paths: *study_paths
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    name: Regenerate fluctuation limits, constrained perturbations and classical preparations
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: research/HDBLAST_CLOSED_HILLTOP_PREPARATION_20261119
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/HDBLAST_CLOSED_HILLTOP_PREPARATION_20261119/
            /research/HDBLAST_OSCILLATING_MODULUS_20261119/archive/BLAST_REHEATING_RESULTS.json
            /research/HDBLAST_OSCILLATING_MODULUS_20261119/archive/blast_common.py
            /research/HDBLAST_OSCILLATING_MODULUS_20261119/background/background.py
            /research/HDBLAST_OSCILLATING_MODULUS_20261119/curvature/curvature.py
            /research/HDBLAST_OSCILLATING_MODULUS_20261119/hilltop/hilltop.py
            /research/HDBLAST_OSCILLATING_MODULUS_20261119/hilltop/check.py
            /research/HDBLAST_OSCILLATING_MODULUS_20261119/hilltop/HILLTOP.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify study and historical inputs
        run: |
          echo 'db8089c989bf564d03fec7e0e5d83675a1fad5838b0b1deaa8f73ce4dda81a0b  SHA256SUMS' | sha256sum -c -
          python -I -B -S reproduce.py
          python -c "import json, pathlib; s=pathlib.Path('.'); root=s.resolve().parents[1]; pins=json.loads((s/'SOURCES.json').read_text()); assert all((s/p['bundled']).read_bytes()==(root/p['path']).read_bytes() for p in pins['sources'])"
      - name: Replay the scientific experiments
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python -m pip install numpy==2.3.5 scipy==1.17.0 mpmath==1.3.0
          python -I -B reproduce.py --verify --jobs 2
