name: All-angular linear shell-contact control

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/HDBLAST_ANGULAR_UNIFORM_CONTACT_20261015/**'
      - 'research/HDBLAST_ANGULAR_UNIFORM_CONTACT_20261015.zip'
      - '.github/workflows/hdblast_angular_uniform_contact.yml'
  push:
    branches: [main]
    paths:
      - 'research/HDBLAST_ANGULAR_UNIFORM_CONTACT_20261015/**'
      - 'research/HDBLAST_ANGULAR_UNIFORM_CONTACT_20261015.zip'
      - '.github/workflows/hdblast_angular_uniform_contact.yml'

permissions:
  contents: read

concurrency:
  group: angular-uniform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fresh-independent-replay:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      PROOF_DIRECTORY: research/HDBLAST_ANGULAR_UNIFORM_CONTACT_20261015
      MANIFEST_SHA256: '68496d0364ca07264d93f5b564a098a14bbbc7039fc791f8560b9f01160ba816'
      ARCHIVE_SHA256: '9a1ac88c63d9aa3062a4c44f1b24ac6cf6350efa6bb457714d82a22bce3fd68a'
      RUNNER_SHA256: 'f5b7b77c0fd56b5bb23bb9b97ad2b4854d93190de3217c192ce55a4798894411'
      VERIFIER_SHA256: '07a989a41c81acf34692d2b8b87fd2c914dac0db0caf43900054479a4a62b80d'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /${{ env.PROOF_DIRECTORY }}/
            /${{ env.PROOF_DIRECTORY }}.zip
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Authenticate manifest, executable bytes and matching ZIP before imports
        shell: bash
        run: |
          set -euo pipefail
          python -I -S -B - <<'PY'
          import hashlib, os, pathlib, shutil, zipfile
          root = pathlib.Path(os.environ['PROOF_DIRECTORY'])
          for name, variable in [('MANIFEST.json', 'MANIFEST_SHA256'),
                                 ('reproduce.py', 'RUNNER_SHA256'),
                                 ('verify_manifest.py', 'VERIFIER_SHA256')]:
              path = root / name
              if any(p.is_symlink() for p in [path, *path.parents]):
                  raise RuntimeError('Real source files required')
              if hashlib.sha256(path.read_bytes()).hexdigest() != os.environ[variable]:
                  raise RuntimeError('External pin differs: ' + name)
          archive = root.with_suffix('.zip')
          if archive.is_symlink() or hashlib.sha256(archive.read_bytes()).hexdigest() != os.environ['ARCHIVE_SHA256']:
              raise RuntimeError('Archive pin differs')
          expected = {p.relative_to(root.parent).as_posix(): p.read_bytes()
                      for p in root.rglob('*') if p.is_file()}
          with zipfile.ZipFile(archive) as zipped:
              if len(zipped.namelist()) != len(expected) or set(zipped.namelist()) != set(expected):
                  raise RuntimeError('Archive members differ')
              if any(zipped.read(name) != raw for name, raw in expected.items()):
                  raise RuntimeError('Archive and source differ')
          shutil.copytree(root, pathlib.Path(os.environ['RUNNER_TEMP']) / 'angular-uniform-source')
          PY
          python -I -S -B "$RUNNER_TEMP/angular-uniform-source/verify_manifest.py" --expected "$MANIFEST_SHA256"
      - name: Install pinned symbolic dependency
        run: |
          python -I -B -m pip install --only-binary=:all: -r "$RUNNER_TEMP/angular-uniform-source/requirements.txt"
      - name: Replay three independent checkers and twenty-two actual corruptions in both modes
        run: |
          python -I -B "$RUNNER_TEMP/angular-uniform-source/reproduce.py" --manifest-sha256 "$MANIFEST_SHA256" --output-dir "$RUNNER_TEMP/angular-uniform-fresh"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: angular-uniform-contact-${{ github.sha }}
          path: ${{ runner.temp }}/angular-uniform-fresh
          retention-days: 14
