name: Directional fermion births on an expanding wall
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/HDBLAST_DIRECTIONAL_BIRTH_20261121/**'
      - '.github/workflows/directional-birth.yml'
      - 'research/HDBLAST_COHERENT_DECAY_20261120/coupled/joined.py'
      - 'research/HDBLAST_COHERENT_DECAY_20261120/coupled/joined_forward.cpp'
      - 'research/HDBLAST_COHERENT_DECAY_20261120/envelope/build.py'
      - 'research/HDBLAST_COHERENT_DECAY_20261120/envelope/ENVELOPE.json'
      - 'research/HDBLAST_COHERENT_DECAY_20261120/kinetics/SWEEP.json'
  push:
    branches: [main]
    paths:
      - 'research/HDBLAST_DIRECTIONAL_BIRTH_20261121/**'
      - '.github/workflows/directional-birth.yml'
      - 'research/HDBLAST_COHERENT_DECAY_20261120/coupled/joined.py'
      - 'research/HDBLAST_COHERENT_DECAY_20261120/coupled/joined_forward.cpp'
      - 'research/HDBLAST_COHERENT_DECAY_20261120/envelope/build.py'
      - 'research/HDBLAST_COHERENT_DECAY_20261120/envelope/ENVELOPE.json'
      - 'research/HDBLAST_COHERENT_DECAY_20261120/kinetics/SWEEP.json'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  replay:
    name: Reproduce directional particle production and scattering checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: research/HDBLAST_DIRECTIONAL_BIRTH_20261121
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/HDBLAST_DIRECTIONAL_BIRTH_20261121/
            /research/HDBLAST_COHERENT_DECAY_20261120/coupled/joined.py
            /research/HDBLAST_COHERENT_DECAY_20261120/coupled/joined_forward.cpp
            /research/HDBLAST_COHERENT_DECAY_20261120/envelope/build.py
            /research/HDBLAST_COHERENT_DECAY_20261120/envelope/ENVELOPE.json
            /research/HDBLAST_COHERENT_DECAY_20261120/kinetics/SWEEP.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify release files and the preceding study inputs
        run: |
          echo '8b4778b8d1c7eddebdff72a0299e1dfe5ac7f538051c91c00ec34cf1b380c2dc  SHA256SUMS' | sha256sum -c -
          python -I -B -S study.py --check-prior ../HDBLAST_COHERENT_DECAY_20261120
      - name: Reproduce all calculations and compare the results
        run: |
          python -m pip install numpy==2.3.5 scipy==1.17.0
          python -I -B study.py --verify --output-dir "$RUNNER_TEMP/directional-replay"
