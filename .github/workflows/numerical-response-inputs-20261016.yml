name: Numerical response input and angular replay
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/HDBLAST_NUMERICAL_RESPONSE_INPUTS_20261016/**'
      - 'research/HDBLAST_NUMERICAL_RESPONSE_INPUTS_20261016.zip'
      - 'hdblast/continuation/2026.10.16-numerical-response-inputs/**'
      - '.github/workflows/numerical-response-inputs-20261016.yml'
      - 'README.md'
      - 'site/index.html'
      - 'site/es/index.html'
  push:
    branches: [main]
    paths:
      - 'research/HDBLAST_NUMERICAL_RESPONSE_INPUTS_20261016/**'
      - 'research/HDBLAST_NUMERICAL_RESPONSE_INPUTS_20261016.zip'
      - 'hdblast/continuation/2026.10.16-numerical-response-inputs/**'
      - '.github/workflows/numerical-response-inputs-20261016.yml'
      - 'README.md'
      - 'site/index.html'
      - 'site/es/index.html'
permissions:
  contents: read
jobs:
  authenticated-scientific-input-replay:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            research/HDBLAST_NUMERICAL_RESPONSE_INPUTS_20261016
            research/HDBLAST_NUMERICAL_RESPONSE_INPUTS_20261016.zip
            hdblast/continuation/2026.10.16-numerical-response-inputs
            .github/workflows/numerical-response-inputs-20261016.yml
            README.md
            site/index.html
            site/es/index.html
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Authenticate closed source and ZIP, then replay all exact certificates
        run: |
          python -I -S -B hdblast/continuation/2026.10.16-numerical-response-inputs/verify_and_reproduce.py --repo-root . --pins hdblast/continuation/2026.10.16-numerical-response-inputs/PUBLICATION_PINS.json --output-dir "$RUNNER_TEMP/numerical-response-inputs-verification"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: numerical-response-inputs-${{ github.sha }}
          path: ${{ runner.temp }}/numerical-response-inputs-verification
          retention-days: 14
