name: Uniform nonlinear initial constraint ball replay
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/HDBLAST_NONLINEAR_CONSTRAINT_BALL_20261113/**'
      - '.github/workflows/nonlinear-constraint-ball-20261113.yml'
  push:
    branches: [main]
    paths:
      - 'research/HDBLAST_NONLINEAR_CONSTRAINT_BALL_20261113/**'
      - '.github/workflows/nonlinear-constraint-ball-20261113.yml'
permissions:
  contents: read
jobs:
  nonlinear-constraint-ball:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Install exact hash-pinned algebra wheels
        run: |
          python -m venv "$RUNNER_TEMP/nonlinear-ball-env"
          "$RUNNER_TEMP/nonlinear-ball-env/bin/python" -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r research/HDBLAST_NONLINEAR_CONSTRAINT_BALL_20261113/requirements-checks.txt
      - name: Replay the authenticated canonical and nonlinear ball ledgers in both modes
        run: |
          "$RUNNER_TEMP/nonlinear-ball-env/bin/python" -I -B research/HDBLAST_NONLINEAR_CONSTRAINT_BALL_20261113/checks/check_checkpoint.py --manifest-sha256 e2633fb2ee645dcb787e8fe076df99ddc1d5c8f1d31a140e179545f2c3c44015 --output "$RUNNER_TEMP/nonlinear-ball-normal.json"
          "$RUNNER_TEMP/nonlinear-ball-env/bin/python" -O -I -B research/HDBLAST_NONLINEAR_CONSTRAINT_BALL_20261113/checks/check_checkpoint.py --manifest-sha256 e2633fb2ee645dcb787e8fe076df99ddc1d5c8f1d31a140e179545f2c3c44015 --output "$RUNNER_TEMP/nonlinear-ball-optimized.json"
          cmp "$RUNNER_TEMP/nonlinear-ball-normal.json" "$RUNNER_TEMP/nonlinear-ball-optimized.json"
      - name: Reject protocol faults and freshly rehashed mathematical faults
        run: |
          "$RUNNER_TEMP/nonlinear-ball-env/bin/python" -I -B research/HDBLAST_NONLINEAR_CONSTRAINT_BALL_20261113/checks/run_controls.py --manifest-sha256 e2633fb2ee645dcb787e8fe076df99ddc1d5c8f1d31a140e179545f2c3c44015 --output-dir "$RUNNER_TEMP/nonlinear-ball-auth-fresh"
          "$RUNNER_TEMP/nonlinear-ball-env/bin/python" -I -B research/HDBLAST_NONLINEAR_CONSTRAINT_BALL_20261113/checks/run_math_controls.py --manifest-sha256 e2633fb2ee645dcb787e8fe076df99ddc1d5c8f1d31a140e179545f2c3c44015 --output-dir "$RUNNER_TEMP/nonlinear-ball-math-fresh"
