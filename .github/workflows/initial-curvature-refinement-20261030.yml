name: Initial curvature refinement and C2 transfer
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/HDBLAST_INITIAL_CURVATURE_REFINEMENT_20261030/**'
      - '.github/workflows/initial-curvature-refinement-20261030.yml'
  push:
    branches: [main]
    paths:
      - 'research/HDBLAST_INITIAL_CURVATURE_REFINEMENT_20261030/**'
      - '.github/workflows/initial-curvature-refinement-20261030.yml'
permissions:
  contents: read
jobs:
  exact-initial-error-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Replay initial diagnostics, independent audits and unchanged-candidate C2 bounds
        run: python -I -S -B research/HDBLAST_INITIAL_CURVATURE_REFINEMENT_20261030/checks/run_checkpoint.py --repo-root . --output-dir "$RUNNER_TEMP/initial-curvature-fresh"
