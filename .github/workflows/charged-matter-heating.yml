name: Charged matter heating on a curved wall
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/HDBLAST_CHARGED_MATTER_HEATING_20261120/**'
      - '.github/workflows/charged-matter-heating.yml'
      - 'research/HDBLAST_CURVED_MAXWELL_SCALAR_WALL_20261120/loading/forward.cpp'
  push:
    branches: [main]
    paths:
      - 'research/HDBLAST_CHARGED_MATTER_HEATING_20261120/**'
      - '.github/workflows/charged-matter-heating.yml'
      - 'research/HDBLAST_CURVED_MAXWELL_SCALAR_WALL_20261120/loading/forward.cpp'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  replay:
    name: Reproduce charged-particle and electromagnetic energy transfer
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: research/HDBLAST_CHARGED_MATTER_HEATING_20261120
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/HDBLAST_CHARGED_MATTER_HEATING_20261120/
            /research/HDBLAST_CURVED_MAXWELL_SCALAR_WALL_20261120/loading/forward.cpp
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify archived files and pinned input hashes
        run: |
          echo '05a3bd7794bb862119706531f78cff19cdea4efb6609d584a4c266da4d74e10e  SHA256SUMS' | sha256sum -c -
          cmp background/forward.cpp ../HDBLAST_CURVED_MAXWELL_SCALAR_WALL_20261120/loading/forward.cpp
          python -I -B -S study.py
      - name: Regenerate the background and charged-matter calculations
        run: |
          python -m pip install numpy==2.3.5 scipy==1.17.0
          python -I -B study.py --verify
