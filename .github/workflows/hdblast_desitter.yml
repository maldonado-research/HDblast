name: Massive de Sitter sources and stationary sensitivity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/HDBLAST_CHECKPOINT_20261002_DESITTER/**'
      - '.github/workflows/hdblast_desitter.yml'
      - 'research/HDBLAST_CHECKPOINT_20261002_JUNCTIONS/**'
      - 'research/HDBLAST_CHECKPOINT_20261002_SMOOTH_FRW/COMMON_ACTION_SMOOTH_FRW.md'
      - 'research/HDBLAST_CHECKPOINT_20260927/stability_gauge_invariant/**'
  pull_request:
    paths:
      - 'research/HDBLAST_CHECKPOINT_20261002_DESITTER/**'
      - '.github/workflows/hdblast_desitter.yml'
      - 'research/HDBLAST_CHECKPOINT_20261002_JUNCTIONS/**'
      - 'research/HDBLAST_CHECKPOINT_20261002_SMOOTH_FRW/COMMON_ACTION_SMOOTH_FRW.md'
      - 'research/HDBLAST_CHECKPOINT_20260927/stability_gauge_invariant/**'

permissions:
  contents: read

jobs:
  source-and-sensitivity-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONOPTIMIZE: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            research
            hdblast
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned numerical and algebra dependencies
        run: |
          python -m pip install --only-binary=:all: -r research/HDBLAST_CHECKPOINT_20261002_DESITTER/requirements.txt
      - name: Verify inputs and execute fresh benchmark and sensitivity matrix
        run: |
          python research/HDBLAST_CHECKPOINT_20261002_DESITTER/code/replay_checkpoint.py --repo "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/desitter-replay"
      - name: Retain actual execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desitter-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/desitter-replay/
          if-no-files-found: warn
          retention-days: 7
