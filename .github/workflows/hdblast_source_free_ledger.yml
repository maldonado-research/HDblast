name: Registered source-free ledger diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main, 'research/20261002-source-free-ledger', 'research/20261002-source-free-ledger-curated-mirror']
    paths:
      - 'research/HDBLAST_CHECKPOINT_20261002_SOURCE_FREE_LEDGER/**'
      - '.github/workflows/hdblast_source_free_ledger.yml'
  pull_request:
    paths:
      - 'research/HDBLAST_CHECKPOINT_20261002_SOURCE_FREE_LEDGER/**'
      - '.github/workflows/hdblast_source_free_ledger.yml'

permissions:
  contents: read

jobs:
  complete-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONOPTIMIZE: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
      BLIS_NUM_THREADS: '1'
      MPLBACKEND: Agg
      REGISTERED_FREEZE_COMMIT: '06984aa6b142499c592850e6b4afd49c28ced394'
      REGISTERED_SHA256: 'e7a8fe5f6991bad9304440b037ce2eefafdfbaf9c011e177eb9b364b3239bba1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          sparse-checkout: |
            research/HDBLAST_CHECKPOINT_20261002_SOURCE_FREE_LEDGER
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Install frozen replay dependencies
        run: |
          python -m pip install --only-binary=:all: -r research/HDBLAST_CHECKPOINT_20261002_SOURCE_FREE_LEDGER/requirements-replay.txt
      - name: Synthetic guards in normal Python
        run: |
          python research/HDBLAST_CHECKPOINT_20261002_SOURCE_FREE_LEDGER/code/test_replay_package_guards.py > "$RUNNER_TEMP/ledger-guards-normal.stdout.log" 2> "$RUNNER_TEMP/ledger-guards-normal.stderr.log"
      - name: Synthetic guards in optimized Python
        run: |
          python -O research/HDBLAST_CHECKPOINT_20261002_SOURCE_FREE_LEDGER/code/test_replay_package_guards.py > "$RUNNER_TEMP/ledger-guards-optimized.stdout.log" 2> "$RUNNER_TEMP/ledger-guards-optimized.stderr.log"
      - name: Verify public freeze and reproduce complete diagnostic
        run: |
          python - <<'PY' > "$RUNNER_TEMP/ledger-reproduction.stdout.log" 2> "$RUNNER_TEMP/ledger-reproduction.stderr.log"
          import json, os, pathlib, subprocess, sys
          root = pathlib.Path('research/HDBLAST_CHECKPOINT_20261002_SOURCE_FREE_LEDGER').resolve()
          receipt = json.loads((root / 'FREEZE_RECEIPT.json').read_text())
          registered_sha = os.environ['REGISTERED_SHA256']
          freeze = os.environ['REGISTERED_FREEZE_COMMIT']
          if receipt['registration_sha256'] != registered_sha or receipt['public_freeze_commit'] != freeze:
              raise SystemExit('Freeze receipt differs from reviewed immutable workflow pins')
          public_branch = 'research/20261002-source-free-ledger'
          subprocess.run(['git', 'fetch', '--no-tags', 'https://github.com/maldonado-research/HDblast.git',
                          '+refs/heads/' + public_branch + ':refs/remotes/ledger-public/' + public_branch], check=True)
          subprocess.run(['git', 'merge-base', '--is-ancestor', freeze, 'ledger-public/' + public_branch], check=True)
          repository = os.environ['GITHUB_REPOSITORY']
          if repository == 'maldonado-research/HDblast':
              subprocess.run(['git', 'merge-base', '--is-ancestor', freeze, 'HEAD'], check=True)
          elif repository != 'maldonado-research/HDblast-archive':
              raise SystemExit('Unregistered repository identity')
          # The curated private mirror has its own Git ancestry; the verifier
          # below still compares every frozen byte with the public freeze object.
          pins = ['--registration-sha256', registered_sha, '--freeze-commit', freeze]
          subprocess.run([sys.executable, str(root / 'code/verify_public_freeze.py'), '--checkpoint-root', str(root),
                          '--repository-root', str(pathlib.Path.cwd()), *pins], check=True)
          subprocess.run([sys.executable, str(root / 'code/replay_ledger.py'), '--checkpoint-root', str(root),
                          *pins, '--output-dir', str(pathlib.Path(os.environ['RUNNER_TEMP']) / 'ledger-full-replay')], check=True)
          PY
      - name: Preserve every diagnostic output, progress record, log and receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-free-ledger-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ledger-full-replay/
            ${{ runner.temp }}/ledger-guards-normal.stdout.log
            ${{ runner.temp }}/ledger-guards-normal.stderr.log
            ${{ runner.temp }}/ledger-guards-optimized.stdout.log
            ${{ runner.temp }}/ledger-guards-optimized.stderr.log
            ${{ runner.temp }}/ledger-reproduction.stdout.log
            ${{ runner.temp }}/ledger-reproduction.stderr.log
          if-no-files-found: warn
          retention-days: 7
