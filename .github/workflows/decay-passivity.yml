name: Decay basis and physical energy
on:
  pull_request:
    paths:
      - 'research/HDBLAST_DECAY_PASSIVITY_20261119/**'
      - '.github/workflows/decay-passivity.yml'
  push:
    paths:
      - 'research/HDBLAST_DECAY_PASSIVITY_20261119/**'
      - '.github/workflows/decay-passivity.yml'
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/HDBLAST_DECAY_PASSIVITY_20261119
            research/HDBLAST_SOURCE_WORK_20261118/coupled
            research/HDBLAST_PULSE_PARTICLE_RESPONSE_20261118/classical/runs
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the study manifest
        working-directory: research/HDBLAST_DECAY_PASSIVITY_20261119
        run: |
          echo '8a353ef7853ba2eace9196dec6259498ce5829a6fde2e7374d9bcfa0394ea8da  SHA256SUMS' | sha256sum -c -
          sha256sum --quiet -c SHA256SUMS
          python -I -B reproduce.py
      - name: Install numerical dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - name: Recompute the open-system and collision experiments
        working-directory: research/HDBLAST_DECAY_PASSIVITY_20261119
        run: python -I -B -O reproduce.py --full
