name: Bulk pulse and prebirth field transfer on the HDblast wall
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'research/HDBLAST_PREBIRTH_TRANSFER_20261121/**'
      - '.github/workflows/prebirth-transfer.yml'
  push:
    branches: [main]
    paths:
      - 'research/HDBLAST_PREBIRTH_TRANSFER_20261121/**'
      - '.github/workflows/prebirth-transfer.yml'

permissions:
  contents: read

jobs:
  replay:
    name: Regenerate the bulk pulse, its field on the wall and the particle response
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    defaults:
      run:
        working-directory: research/HDBLAST_PREBIRTH_TRANSFER_20261121
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: /research/HDBLAST_PREBIRTH_TRANSFER_20261121/
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify archived sources and predecessor inputs
        run: |
          echo '582302b0a445bf697a21c89b9aa4ac1f2afc9e380830f7731761e30d8ca7c1ec  SHA256SUMS' | sha256sum -c -
          python -I -B -S study.py
      - name: Reproduce the calculations
        run: |
          python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
          python -I -B study.py --verify --output-dir "$RUNNER_TEMP/prebirth-results"
      - name: Retain numerical results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: prebirth-results
          path: |
            ${{ runner.temp }}/prebirth-results/**/*.json
          if-no-files-found: ignore
          retention-days: 14
