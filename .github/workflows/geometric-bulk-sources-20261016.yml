name: Geometric bulk source and intrinsic shell replay
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/HDBLAST_GEOMETRIC_BULK_SOURCES_20261016/**'
      - 'research/HDBLAST_RESPONSE_ATTRIBUTION_20261016/**'
      - 'research/HDBLAST_GEOMETRIC_BULK_SOURCES_20261016.zip'
      - 'hdblast/continuation/2026.10.16-geometric-bulk-sources/**'
      - '.github/workflows/geometric-bulk-sources-20261016.yml'
      - 'README.md'
      - 'site/index.html'
      - 'site/es/index.html'
  push:
    branches: [main]
    paths:
      - 'research/HDBLAST_GEOMETRIC_BULK_SOURCES_20261016/**'
      - 'research/HDBLAST_RESPONSE_ATTRIBUTION_20261016/**'
      - 'research/HDBLAST_GEOMETRIC_BULK_SOURCES_20261016.zip'
      - 'hdblast/continuation/2026.10.16-geometric-bulk-sources/**'
      - '.github/workflows/geometric-bulk-sources-20261016.yml'
      - 'README.md'
      - 'site/index.html'
      - 'site/es/index.html'
permissions:
  contents: read
jobs:
  authenticated-scientific-input-replay:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            research/HDBLAST_GEOMETRIC_BULK_SOURCES_20261016
            research/HDBLAST_RESPONSE_ATTRIBUTION_20261016
            research/HDBLAST_GEOMETRIC_BULK_SOURCES_20261016.zip
            hdblast/continuation/2026.10.16-geometric-bulk-sources
            .github/workflows/geometric-bulk-sources-20261016.yml
            README.md
            site/index.html
            site/es/index.html
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Authenticate closed source and ZIP, then replay all exact certificates
        run: |
          python -I -S -B hdblast/continuation/2026.10.16-geometric-bulk-sources/verify_and_reproduce.py --repo-root . --pins hdblast/continuation/2026.10.16-geometric-bulk-sources/PUBLICATION_PINS.json --output-dir "$RUNNER_TEMP/geometric-bulk-sources-verification"
      - name: Authenticate separate attribution and run four arithmetic checks
        run: |
          python -I -S -B research/HDBLAST_RESPONSE_ATTRIBUTION_20261016/verify_followon.py --pins-sha256 ffbc2144c5dbdc30de74ce788073ac71fdda330f90b6d61a2bf576fae9879605 --output-dir "$RUNNER_TEMP/response-attribution-verification"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geometric-bulk-sources-${{ github.sha }}
          path: |
            ${{ runner.temp }}/geometric-bulk-sources-verification
            ${{ runner.temp }}/response-attribution-verification
          retention-days: 14
