name: Smooth active shell contact
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/HDBLAST_SMOOTH_SHELL_CONTACT_20261030/**'
      - '.github/workflows/smooth-shell-contact-20261030.yml'
  push:
    branches: [main]
    paths:
      - 'research/HDBLAST_SMOOTH_SHELL_CONTACT_20261030/**'
      - '.github/workflows/smooth-shell-contact-20261030.yml'
permissions:
  contents: read
jobs:
  exact-and-interval-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Shell identities and independent interval enclosures in both modes
        shell: bash
        run: |
          set -euo pipefail
          cap=research/HDBLAST_SMOOTH_SHELL_CONTACT_20261030
          python -I -S -B "$cap/checks/check_contact_identities.py" > "$RUNNER_TEMP/identity.normal.json"
          python -I -S -B -O "$cap/checks/check_contact_identities.py" > "$RUNNER_TEMP/identity.optimized.json"
          cmp "$RUNNER_TEMP/identity.normal.json" "$RUNNER_TEMP/identity.optimized.json"
          cat "$RUNNER_TEMP/identity.normal.json"
          for name in check_affine_shell_source check_shell_contact check_coarse_shell; do
            python -I -S -B "$cap/checks/$name.py" --repo-root . > "$RUNNER_TEMP/$name.normal.json"
            python -I -S -B -O "$cap/checks/$name.py" --repo-root . > "$RUNNER_TEMP/$name.optimized.json"
            cmp "$RUNNER_TEMP/$name.normal.json" "$RUNNER_TEMP/$name.optimized.json"
          done
          cmp "$RUNNER_TEMP/check_affine_shell_source.normal.json" "$cap/reference/AFFINE_SOURCE.json"
          cmp "$RUNNER_TEMP/check_shell_contact.normal.json" "$cap/reference/SHELL.json"
          cmp "$RUNNER_TEMP/check_coarse_shell.normal.json" "$cap/reference/COARSE.json"
          python -I -S -B "$cap/checks/compare_shell_enclosures.py" --detailed "$RUNNER_TEMP/check_shell_contact.normal.json" --coarse "$RUNNER_TEMP/check_coarse_shell.normal.json" --source "$RUNNER_TEMP/check_affine_shell_source.normal.json" > "$RUNNER_TEMP/compare.normal.json"
          python -I -S -B -O "$cap/checks/compare_shell_enclosures.py" --detailed "$RUNNER_TEMP/check_shell_contact.normal.json" --coarse "$RUNNER_TEMP/check_coarse_shell.normal.json" --source "$RUNNER_TEMP/check_affine_shell_source.normal.json" > "$RUNNER_TEMP/compare.optimized.json"
          cmp "$RUNNER_TEMP/compare.normal.json" "$RUNNER_TEMP/compare.optimized.json"
          cat "$RUNNER_TEMP/compare.normal.json"
