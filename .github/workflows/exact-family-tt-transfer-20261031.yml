name: Conditional exact-family TT transfer replay
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/HDBLAST_EXACT_FAMILY_TT_TRANSFER_20261031/**'
      - '.github/workflows/exact-family-tt-transfer-20261031.yml'
  push:
    branches: [main]
    paths:
      - 'research/HDBLAST_EXACT_FAMILY_TT_TRANSFER_20261031/**'
      - '.github/workflows/exact-family-tt-transfer-20261031.yml'
permissions:
  contents: read
jobs:
  conditional-exact-family-transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Install pinned exact symbolic dependencies
        run: python -m pip install -r research/HDBLAST_EXACT_FAMILY_TT_TRANSFER_20261031/requirements.txt
      - name: Replay new transfer checks and the unchanged postcontact enclosure
        run: python -I -S -B research/HDBLAST_EXACT_FAMILY_TT_TRANSFER_20261031/checks/run_checkpoint.py --repo-root . --output-dir "$RUNNER_TEMP/exact-family-transfer-fresh"
