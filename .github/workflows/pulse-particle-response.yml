name: Particle response to an incoming bulk pulse
on:
  pull_request:
    paths:
      - 'research/HDBLAST_PULSE_PARTICLE_RESPONSE_20261118/**'
      - '.github/workflows/pulse-particle-response.yml'
  push:
    paths:
      - 'research/HDBLAST_PULSE_PARTICLE_RESPONSE_20261118/**'
      - '.github/workflows/pulse-particle-response.yml'
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/HDBLAST_PULSE_PARTICLE_RESPONSE_20261118
            research/HDBLAST_INCIDENT_PULSE_20261118
            research/HDBLAST_CHECKPOINT_20260930/B1_derived_chi_source
            research/HDBLAST_CHECKPOINT_20260927/mechanisms/pilot_5d
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the capsule and inputs
        working-directory: research/HDBLAST_PULSE_PARTICLE_RESPONSE_20261118
        run: |
          echo '434f2d8522e3d7d4902359cdcf7632b874fa7f114b286465ff704ac6902edb7d  SHA256SUMS' | sha256sum -c -
          sha256sum -c SHA256SUMS
      - name: Install numerical dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - name: Recompute the particle, detector and scattering results
        working-directory: research/HDBLAST_PULSE_PARTICLE_RESPONSE_20261118
        run: |
          python -I -B reproduce.py --full
          python -I -B -O reproduce.py
