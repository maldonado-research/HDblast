name: Reduced nonlinear limit, time continuity and causal support replay
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/HDBLAST_NONLINEAR_PICARD_LIMIT_20261114/**'
      - '.github/workflows/nonlinear-picard-limit-20261114.yml'
  push:
    branches: [main]
    paths:
      - 'research/HDBLAST_NONLINEAR_PICARD_LIMIT_20261114/**'
      - '.github/workflows/nonlinear-picard-limit-20261114.yml'
permissions:
  contents: read
jobs:
  nonlinear-limit-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Install exact hash-pinned algebra wheels
        run: |
          python -m venv "$RUNNER_TEMP/nonlinear-limit-env"
          "$RUNNER_TEMP/nonlinear-limit-env/bin/python" -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r research/HDBLAST_NONLINEAR_PICARD_LIMIT_20261114/requirements-checks.txt
      - name: Replay the authenticated source, factorial and extension ledgers in both modes
        run: |
          "$RUNNER_TEMP/nonlinear-limit-env/bin/python" -I -B research/HDBLAST_NONLINEAR_PICARD_LIMIT_20261114/checks/check_checkpoint.py --manifest-sha256 052f08de0105e6b4fd0a0c21b95f6d3711aba491fa420a445e7cfb80e2bd5ddf --output "$RUNNER_TEMP/nonlinear-limit-normal.json"
          "$RUNNER_TEMP/nonlinear-limit-env/bin/python" -O -I -B research/HDBLAST_NONLINEAR_PICARD_LIMIT_20261114/checks/check_checkpoint.py --manifest-sha256 052f08de0105e6b4fd0a0c21b95f6d3711aba491fa420a445e7cfb80e2bd5ddf --output "$RUNNER_TEMP/nonlinear-limit-optimized.json"
          cmp "$RUNNER_TEMP/nonlinear-limit-normal.json" "$RUNNER_TEMP/nonlinear-limit-optimized.json"
      - name: Reject protocol faults and freshly rehashed mathematical faults
        run: |
          "$RUNNER_TEMP/nonlinear-limit-env/bin/python" -I -B research/HDBLAST_NONLINEAR_PICARD_LIMIT_20261114/checks/run_controls.py --manifest-sha256 052f08de0105e6b4fd0a0c21b95f6d3711aba491fa420a445e7cfb80e2bd5ddf --output-dir "$RUNNER_TEMP/nonlinear-limit-auth-fresh"
          "$RUNNER_TEMP/nonlinear-limit-env/bin/python" -O -I -B research/HDBLAST_NONLINEAR_PICARD_LIMIT_20261114/checks/run_math_controls.py --manifest-sha256 052f08de0105e6b4fd0a0c21b95f6d3711aba491fa420a445e7cfb80e2bd5ddf --output-dir "$RUNNER_TEMP/nonlinear-limit-math-fresh"
