name: Causal Yukawa energy account
on:
  pull_request:
    paths:
      - 'research/HDBLAST_CAUSAL_YUKAWA_ENERGY_20261119/**'
      - '.github/workflows/causal-yukawa-energy.yml'
  push:
    paths:
      - 'research/HDBLAST_CAUSAL_YUKAWA_ENERGY_20261119/**'
      - '.github/workflows/causal-yukawa-energy.yml'
permissions:
  contents: read
jobs:
  reproduce:
    name: Replay the causal energy account and independent controls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/HDBLAST_CAUSAL_YUKAWA_ENERGY_20261119
            research/HDBLAST_COVARIANCE_FEEDBACK_20261119/native
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Authenticate study and historical inputs
        working-directory: research/HDBLAST_CAUSAL_YUKAWA_ENERGY_20261119
        run: |
          echo 'a9115bb333ccabc80734d66f922fc7d84ce04f830ec7c5ddeaec5cd140581f2e  SHA256SUMS' | sha256sum -c -
          python -I -B -S reproduce.py
      - name: Recompute published numerical experiments
        working-directory: research/HDBLAST_CAUSAL_YUKAWA_ENERGY_20261119
        run: |
          python -m pip install numpy==2.3.5 scipy==1.17.0
          python -I -B reproduce.py --verify
