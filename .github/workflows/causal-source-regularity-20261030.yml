name: Master fourth derivatives and causal candidate regularity
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/HDBLAST_CAUSAL_SOURCE_REGULARITY_20261030/**'
      - '.github/workflows/causal-source-regularity-20261030.yml'
  push:
    branches: [main]
    paths:
      - 'research/HDBLAST_CAUSAL_SOURCE_REGULARITY_20261030/**'
      - '.github/workflows/causal-source-regularity-20261030.yml'
permissions:
  contents: read
jobs:
  exact-derivatives-and-residuals:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Reproduce exact bounds, independent audits and corrupted controls
        run: python -I -S -B research/HDBLAST_CAUSAL_SOURCE_REGULARITY_20261030/checks/run_checkpoint.py --repo-root . --output-dir "$RUNNER_TEMP/causal-source-regularity-fresh"
