name: Renewed Dirac pair production on the shell
on:
  pull_request:
    branches: [main]
    paths: &study_paths
      - 'research/HDBLAST_RENEWED_PAIR_PRODUCTION_20261119/**'
      - '.github/workflows/renewed-dirac-pairs.yml'
      - 'research/HDBLAST_COVARIANCE_FEEDBACK_20261119/native/FORK.json'
      - 'research/HDBLAST_COVARIANCE_FEEDBACK_20261119/native/WALLS.zip'
      - 'research/HDBLAST_POST_GATE_TRANSPORT_20261119/daughters/DISTRIBUTIONS.json'
      - 'research/HDBLAST_QUANTUM_MEMORY_20261119/gravity/gravity.py'
      - 'research/HDBLAST_QUANTUM_MEMORY_20261119/quantum/SPECTRUM.json'
      - 'research/HDBLAST_QUANTUM_MEMORY_20261119/quantum/spectrum.py'
      - 'research/HDBLAST_QUANTUM_MEMORY_20261119/source/quadrature.py'
      - 'research/HDBLAST_QUANTUM_MEMORY_20261119/source/source.py'
      - 'research/HDBLAST_SCALAR_CLOCK_GRAVITY_20261119/bulk/READOUTS.csv'
      - 'research/HDBLAST_SCALAR_CLOCK_GRAVITY_20261119/bulk/live.py'
      - 'research/HDBLAST_SCALAR_CLOCK_GRAVITY_20261119/bulk/vendor/FORK_INPUTS.zip'
      - 'research/HDBLAST_SCALAR_CLOCK_GRAVITY_20261119/bulk/vendor/SHA256SUMS'
      - 'research/HDBLAST_SCALAR_CLOCK_GRAVITY_20261119/bulk/vendor/evolve_b1.py'
      - 'research/HDBLAST_SCALAR_CLOCK_GRAVITY_20261119/bulk/vendor/quantum_shell.py'
      - 'research/HDBLAST_SCALAR_CLOCK_GRAVITY_20261119/bulk/vendor/references.zip'
      - 'research/HDBLAST_SCALAR_CLOCK_GRAVITY_20261119/bulk/vendor/refs.json'
      - 'research/HDBLAST_SCALAR_CLOCK_GRAVITY_20261119/bulk/vendor/rolling_data.py'
      - 'research/HDBLAST_SCALAR_CLOCK_GRAVITY_20261119/bulk/vendor/rolloff5d_v1.py'
      - 'research/HDBLAST_SCALAR_CLOCK_GRAVITY_20261119/bulk/vendor/shell_matter.py'
      - 'research/HDBLAST_SCALAR_CLOCK_GRAVITY_20261119/bulk/vendor/static_w.py'
  push:
    branches: [main]
    paths: *study_paths
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    name: Regenerate particle spectra, chemical bounds and native gravity
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: research/HDBLAST_RENEWED_PAIR_PRODUCTION_20261119
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/HDBLAST_RENEWED_PAIR_PRODUCTION_20261119/
            /research/HDBLAST_COVARIANCE_FEEDBACK_20261119/native/FORK.json
            /research/HDBLAST_COVARIANCE_FEEDBACK_20261119/native/WALLS.zip
            /research/HDBLAST_POST_GATE_TRANSPORT_20261119/daughters/DISTRIBUTIONS.json
            /research/HDBLAST_QUANTUM_MEMORY_20261119/gravity/gravity.py
            /research/HDBLAST_QUANTUM_MEMORY_20261119/quantum/SPECTRUM.json
            /research/HDBLAST_QUANTUM_MEMORY_20261119/quantum/spectrum.py
            /research/HDBLAST_QUANTUM_MEMORY_20261119/source/quadrature.py
            /research/HDBLAST_QUANTUM_MEMORY_20261119/source/source.py
            /research/HDBLAST_SCALAR_CLOCK_GRAVITY_20261119/bulk/READOUTS.csv
            /research/HDBLAST_SCALAR_CLOCK_GRAVITY_20261119/bulk/live.py
            /research/HDBLAST_SCALAR_CLOCK_GRAVITY_20261119/bulk/vendor/FORK_INPUTS.zip
            /research/HDBLAST_SCALAR_CLOCK_GRAVITY_20261119/bulk/vendor/SHA256SUMS
            /research/HDBLAST_SCALAR_CLOCK_GRAVITY_20261119/bulk/vendor/evolve_b1.py
            /research/HDBLAST_SCALAR_CLOCK_GRAVITY_20261119/bulk/vendor/quantum_shell.py
            /research/HDBLAST_SCALAR_CLOCK_GRAVITY_20261119/bulk/vendor/references.zip
            /research/HDBLAST_SCALAR_CLOCK_GRAVITY_20261119/bulk/vendor/refs.json
            /research/HDBLAST_SCALAR_CLOCK_GRAVITY_20261119/bulk/vendor/rolling_data.py
            /research/HDBLAST_SCALAR_CLOCK_GRAVITY_20261119/bulk/vendor/rolloff5d_v1.py
            /research/HDBLAST_SCALAR_CLOCK_GRAVITY_20261119/bulk/vendor/shell_matter.py
            /research/HDBLAST_SCALAR_CLOCK_GRAVITY_20261119/bulk/vendor/static_w.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify study and historical inputs
        run: |
          echo 'cdc392d86ece6ca46e20e19ef1413427de32535998ceefe20e56473ac3b7ba0b  SHA256SUMS' | sha256sum -c -
          python -I -B -S reproduce.py
      - name: Replay the scientific experiments
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python -m pip install numpy==2.3.5 scipy==1.17.0
          python -I -B reproduce.py --verify --jobs 2
