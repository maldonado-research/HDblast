name: Quantitative evolution inputs replay
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/HDBLAST_EVOLUTION_BOUNDS_20261106/**'
      - '.github/workflows/evolution-bounds-20261106.yml'
  push:
    branches: [main]
    paths:
      - 'research/HDBLAST_EVOLUTION_BOUNDS_20261106/**'
      - '.github/workflows/evolution-bounds-20261106.yml'
permissions:
  contents: read
jobs:
  evolution-bounds:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Replay finite coefficient, gauge and energy inputs in both modes
        run: |
          python -I -S -B research/HDBLAST_EVOLUTION_BOUNDS_20261106/checks/check_checkpoint.py --manifest-sha256 b2fded5b308daabcbfe0cfebd33f759d3ed746e80b5bf6d0f1b8831330daac59 --output "$RUNNER_TEMP/evolution-bounds-normal.json"
          python -O -I -S -B research/HDBLAST_EVOLUTION_BOUNDS_20261106/checks/check_checkpoint.py --manifest-sha256 b2fded5b308daabcbfe0cfebd33f759d3ed746e80b5bf6d0f1b8831330daac59 --output "$RUNNER_TEMP/evolution-bounds-optimized.json"
          cmp "$RUNNER_TEMP/evolution-bounds-normal.json" "$RUNNER_TEMP/evolution-bounds-optimized.json"
      - name: Reject six source, manifest and arithmetic corruptions
        run: python -I -S -B research/HDBLAST_EVOLUTION_BOUNDS_20261106/checks/run_controls.py --manifest-sha256 b2fded5b308daabcbfe0cfebd33f759d3ed746e80b5bf6d0f1b8831330daac59 --output-dir "$RUNNER_TEMP/evolution-bounds-controls-fresh"
