name: Clock anchor and shell regularity checks
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/HDBLAST_ANCHOR_SHELL_REGULARITY_20261026/**'
      - '.github/workflows/anchor-shell-regularity-20261026.yml'
  push:
    branches: [main]
    paths:
      - 'research/HDBLAST_ANCHOR_SHELL_REGULARITY_20261026/**'
      - '.github/workflows/anchor-shell-regularity-20261026.yml'
permissions:
  contents: read
jobs:
  exact-algebra:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Run exact checks in normal and optimized modes
        shell: bash
        run: |
          set -euo pipefail
          cd research/HDBLAST_ANCHOR_SHELL_REGULARITY_20261026
          for script in checks/check_anchor_composition.py checks/check_label_jacobian.py checks/check_inherited_background.py checks/check_gauge_counterexample.py shell/checks.py; do
            python -I -S -B "$script" > "$RUNNER_TEMP/normal.json"
            python -I -S -B -O "$script" > "$RUNNER_TEMP/optimized.json"
            cmp "$RUNNER_TEMP/normal.json" "$RUNNER_TEMP/optimized.json"
            cat "$RUNNER_TEMP/normal.json"
          done
