name: Oscillating modulus and radiation equality
on:
  pull_request:
    branches: [main]
    paths: &study_paths
      - 'research/HDBLAST_OSCILLATING_MODULUS_20261119/**'
      - '.github/workflows/oscillating-modulus.yml'
      - 'hdblast/checkpoints/2026-09-16_chat09_shell-dynamics/HDBLAST_CHAT9_SHELL_DYNAMICS_20260916/blast_dynamics/BLAST_REHEATING_RESULTS.json'
      - 'hdblast/checkpoints/2026-09-16_chat09_shell-dynamics/HDBLAST_CHAT9_SHELL_DYNAMICS_20260916/blast_dynamics/blast_common.py'
  push:
    branches: [main]
    paths: *study_paths
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    name: Regenerate particle spectra, expansion histories and the closed-bounce boundary
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: research/HDBLAST_OSCILLATING_MODULUS_20261119
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/HDBLAST_OSCILLATING_MODULUS_20261119/
            /hdblast/checkpoints/2026-09-16_chat09_shell-dynamics/HDBLAST_CHAT9_SHELL_DYNAMICS_20260916/blast_dynamics/BLAST_REHEATING_RESULTS.json
            /hdblast/checkpoints/2026-09-16_chat09_shell-dynamics/HDBLAST_CHAT9_SHELL_DYNAMICS_20260916/blast_dynamics/blast_common.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify study and historical inputs
        run: |
          echo 'e100f88b0131807293ba03068a615e1623d9231f1b2864020b93cc34aafc4b17  SHA256SUMS' | sha256sum -c -
          python -I -B -S reproduce.py
          python -c "import json, pathlib; s=pathlib.Path('.'); root=s.resolve().parents[1]; pins=json.loads((s/'SOURCES.json').read_text()); assert all((s/p['bundled']).read_bytes()==(root/p['path']).read_bytes() for p in pins['sources'])"
      - name: Replay the scientific experiments
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python -m pip install numpy==2.3.5 scipy==1.17.0
          python -I -B reproduce.py --verify --jobs 2
