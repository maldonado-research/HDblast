name: Quiet shell interval replay
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/HDBLAST_QUIET_SHELL_INTERVAL_20261105/**'
      - '.github/workflows/quiet-shell-interval-20261105.yml'
  push:
    branches: [main]
    paths:
      - 'research/HDBLAST_QUIET_SHELL_INTERVAL_20261105/**'
      - '.github/workflows/quiet-shell-interval-20261105.yml'
permissions:
  contents: read
jobs:
  quiet-shell-interval:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Check exact arithmetic and source bytes in normal and optimized modes
        run: |
          python -I -S -B research/HDBLAST_QUIET_SHELL_INTERVAL_20261105/checks/check_quiet.py --manifest-sha256 214855810451b47dfd1cc78b3a799e53cdbba9e8029e9e7f146e569bd550f176 --output "$RUNNER_TEMP/quiet-normal.json"
          python -O -I -S -B research/HDBLAST_QUIET_SHELL_INTERVAL_20261105/checks/check_quiet.py --manifest-sha256 214855810451b47dfd1cc78b3a799e53cdbba9e8029e9e7f146e569bd550f176 --output "$RUNNER_TEMP/quiet-optimized.json"
          cmp "$RUNNER_TEMP/quiet-normal.json" "$RUNNER_TEMP/quiet-optimized.json"
      - name: Reject six source, arithmetic or path errors
        run: python -I -S -B research/HDBLAST_QUIET_SHELL_INTERVAL_20261105/checks/run_controls.py --manifest-sha256 214855810451b47dfd1cc78b3a799e53cdbba9e8029e9e7f146e569bd550f176 --output-dir "$RUNNER_TEMP/quiet-controls-fresh"
