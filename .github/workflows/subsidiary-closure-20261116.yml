name: Unreduced Einstein-scalar subsidiary closure replay
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/HDBLAST_SUBSIDIARY_CLOSURE_20261116/**'
      - '.github/workflows/subsidiary-closure-20261116.yml'
  push:
    branches: [main]
    paths:
      - 'research/HDBLAST_SUBSIDIARY_CLOSURE_20261116/**'
      - '.github/workflows/subsidiary-closure-20261116.yml'
permissions:
  contents: read
jobs:
  subsidiary-closure-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Install exact hash-pinned algebra wheels
        run: |
          python -m venv "$RUNNER_TEMP/subsidiary-closure-env"
          "$RUNNER_TEMP/subsidiary-closure-env/bin/python" -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r research/HDBLAST_SUBSIDIARY_CLOSURE_20261116/requirements-checks.txt
      - name: Replay the authenticated source and subsidiary algebra interfaces in both modes
        run: |
          "$RUNNER_TEMP/subsidiary-closure-env/bin/python" -I -B research/HDBLAST_SUBSIDIARY_CLOSURE_20261116/checks/check_checkpoint.py --manifest-sha256 2f7c5d2e415852ff18fc72123cc0f9b716a8d607f019bfe2c62a7c0fb1bd2cff --output "$RUNNER_TEMP/subsidiary-closure-normal.json"
          "$RUNNER_TEMP/subsidiary-closure-env/bin/python" -O -I -B research/HDBLAST_SUBSIDIARY_CLOSURE_20261116/checks/check_checkpoint.py --manifest-sha256 2f7c5d2e415852ff18fc72123cc0f9b716a8d607f019bfe2c62a7c0fb1bd2cff --output "$RUNNER_TEMP/subsidiary-closure-optimized.json"
          cmp "$RUNNER_TEMP/subsidiary-closure-normal.json" "$RUNNER_TEMP/subsidiary-closure-optimized.json"
      - name: Reject protocol faults and freshly rehashed mathematical faults
        run: |
          "$RUNNER_TEMP/subsidiary-closure-env/bin/python" -I -B research/HDBLAST_SUBSIDIARY_CLOSURE_20261116/checks/run_controls.py --manifest-sha256 2f7c5d2e415852ff18fc72123cc0f9b716a8d607f019bfe2c62a7c0fb1bd2cff --output-dir "$RUNNER_TEMP/subsidiary-closure-auth-fresh"
          "$RUNNER_TEMP/subsidiary-closure-env/bin/python" -O -I -B research/HDBLAST_SUBSIDIARY_CLOSURE_20261116/checks/run_math_controls.py --manifest-sha256 2f7c5d2e415852ff18fc72123cc0f9b716a8d607f019bfe2c62a7c0fb1bd2cff --output-dir "$RUNNER_TEMP/subsidiary-closure-math-fresh"
