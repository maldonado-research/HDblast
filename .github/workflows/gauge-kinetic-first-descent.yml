name: Gauge kinetic photons on the first descent
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/HDBLAST_GAUGE_KINETIC_FIRST_DESCENT_20261119/**'
      - '.github/workflows/gauge-kinetic-first-descent.yml'
      - 'hdblast/checkpoints/2026-09-16_chat09_shell-dynamics/HDBLAST_CHAT9_SHELL_DYNAMICS_20260916/background/REGISTERED_SHELL_FLOAT_SOLUTION.json'
      - 'hdblast/checkpoints/2026-09-16_chat09_shell-dynamics/HDBLAST_CHAT9_SHELL_DYNAMICS_20260916/background/hdblast_background.py'
      - 'hdblast/checkpoints/2026-09-16_chat09_shell-dynamics/HDBLAST_CHAT9_SHELL_DYNAMICS_20260916/blast_dynamics/BLAST_DYNAMICS_REPORT.md'
      - 'hdblast/checkpoints/2026-09-16_chat09_shell-dynamics/HDBLAST_CHAT9_SHELL_DYNAMICS_20260916/tensor_and_calibration/TENSOR_SECTOR_AND_CALIBRATION.md'
      - 'research/HDBLAST_SMEARED_QUANTUM_STATES_20261119/prior/homogeneous/exchange.py'
      - 'research/HDBLAST_SMEARED_QUANTUM_STATES_20261119/prior/homogeneous/results.json'
      - 'research/HDBLAST_SMEARED_QUANTUM_STATES_20261119/prior/prior/gravity/evolution/evolve.py'
      - 'research/HDBLAST_SMEARED_QUANTUM_STATES_20261119/prior/prior/gravity/initial/constraint.py'
      - 'research/HDBLAST_SMEARED_QUANTUM_STATES_20261119/prior/prior/gravity/previous/nonlinear/nonlinear.py'
      - 'research/HDBLAST_SMEARED_QUANTUM_STATES_20261119/prior/prior/gravity/previous/prior/archive/BLAST_REHEATING_RESULTS.json'
      - 'research/HDBLAST_SMEARED_QUANTUM_STATES_20261119/prior/prior/gravity/previous/prior/archive/blast_common.py'
      - 'research/HDBLAST_SMEARED_QUANTUM_STATES_20261119/prior/prior/gravity/previous/prior/background/background.py'
      - 'research/HDBLAST_SMEARED_QUANTUM_STATES_20261119/prior/prior/gravity/previous/prior/curvature/curvature.py'
      - 'research/HDBLAST_SMEARED_QUANTUM_STATES_20261119/prior/prior/gravity/previous/prior/hilltop/HILLTOP.json'
      - 'research/HDBLAST_SMEARED_QUANTUM_STATES_20261119/prior/prior/gravity/previous/prior/hilltop/check.py'
      - 'research/HDBLAST_SMEARED_QUANTUM_STATES_20261119/prior/prior/gravity/previous/prior/hilltop/hilltop.py'
      - 'research/HDBLAST_SMEARED_QUANTUM_STATES_20261119/radiation/PHOTONS.json'
  push:
    branches: [main]
    paths:
      - 'research/HDBLAST_GAUGE_KINETIC_FIRST_DESCENT_20261119/**'
      - '.github/workflows/gauge-kinetic-first-descent.yml'
      - 'hdblast/checkpoints/2026-09-16_chat09_shell-dynamics/HDBLAST_CHAT9_SHELL_DYNAMICS_20260916/background/REGISTERED_SHELL_FLOAT_SOLUTION.json'
      - 'hdblast/checkpoints/2026-09-16_chat09_shell-dynamics/HDBLAST_CHAT9_SHELL_DYNAMICS_20260916/background/hdblast_background.py'
      - 'hdblast/checkpoints/2026-09-16_chat09_shell-dynamics/HDBLAST_CHAT9_SHELL_DYNAMICS_20260916/blast_dynamics/BLAST_DYNAMICS_REPORT.md'
      - 'hdblast/checkpoints/2026-09-16_chat09_shell-dynamics/HDBLAST_CHAT9_SHELL_DYNAMICS_20260916/tensor_and_calibration/TENSOR_SECTOR_AND_CALIBRATION.md'
      - 'research/HDBLAST_SMEARED_QUANTUM_STATES_20261119/prior/homogeneous/exchange.py'
      - 'research/HDBLAST_SMEARED_QUANTUM_STATES_20261119/prior/homogeneous/results.json'
      - 'research/HDBLAST_SMEARED_QUANTUM_STATES_20261119/prior/prior/gravity/evolution/evolve.py'
      - 'research/HDBLAST_SMEARED_QUANTUM_STATES_20261119/prior/prior/gravity/initial/constraint.py'
      - 'research/HDBLAST_SMEARED_QUANTUM_STATES_20261119/prior/prior/gravity/previous/nonlinear/nonlinear.py'
      - 'research/HDBLAST_SMEARED_QUANTUM_STATES_20261119/prior/prior/gravity/previous/prior/archive/BLAST_REHEATING_RESULTS.json'
      - 'research/HDBLAST_SMEARED_QUANTUM_STATES_20261119/prior/prior/gravity/previous/prior/archive/blast_common.py'
      - 'research/HDBLAST_SMEARED_QUANTUM_STATES_20261119/prior/prior/gravity/previous/prior/background/background.py'
      - 'research/HDBLAST_SMEARED_QUANTUM_STATES_20261119/prior/prior/gravity/previous/prior/curvature/curvature.py'
      - 'research/HDBLAST_SMEARED_QUANTUM_STATES_20261119/prior/prior/gravity/previous/prior/hilltop/HILLTOP.json'
      - 'research/HDBLAST_SMEARED_QUANTUM_STATES_20261119/prior/prior/gravity/previous/prior/hilltop/check.py'
      - 'research/HDBLAST_SMEARED_QUANTUM_STATES_20261119/prior/prior/gravity/previous/prior/hilltop/hilltop.py'
      - 'research/HDBLAST_SMEARED_QUANTUM_STATES_20261119/radiation/PHOTONS.json'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  reproduce:
    name: Reproduce the photon and energy-transfer calculations
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: research/HDBLAST_GAUGE_KINETIC_FIRST_DESCENT_20261119
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/HDBLAST_GAUGE_KINETIC_FIRST_DESCENT_20261119/
            /hdblast/checkpoints/2026-09-16_chat09_shell-dynamics/HDBLAST_CHAT9_SHELL_DYNAMICS_20260916/background/REGISTERED_SHELL_FLOAT_SOLUTION.json
            /hdblast/checkpoints/2026-09-16_chat09_shell-dynamics/HDBLAST_CHAT9_SHELL_DYNAMICS_20260916/background/hdblast_background.py
            /hdblast/checkpoints/2026-09-16_chat09_shell-dynamics/HDBLAST_CHAT9_SHELL_DYNAMICS_20260916/blast_dynamics/BLAST_DYNAMICS_REPORT.md
            /hdblast/checkpoints/2026-09-16_chat09_shell-dynamics/HDBLAST_CHAT9_SHELL_DYNAMICS_20260916/tensor_and_calibration/TENSOR_SECTOR_AND_CALIBRATION.md
            /research/HDBLAST_SMEARED_QUANTUM_STATES_20261119/prior/homogeneous/exchange.py
            /research/HDBLAST_SMEARED_QUANTUM_STATES_20261119/prior/homogeneous/results.json
            /research/HDBLAST_SMEARED_QUANTUM_STATES_20261119/prior/prior/gravity/evolution/evolve.py
            /research/HDBLAST_SMEARED_QUANTUM_STATES_20261119/prior/prior/gravity/initial/constraint.py
            /research/HDBLAST_SMEARED_QUANTUM_STATES_20261119/prior/prior/gravity/previous/nonlinear/nonlinear.py
            /research/HDBLAST_SMEARED_QUANTUM_STATES_20261119/prior/prior/gravity/previous/prior/archive/BLAST_REHEATING_RESULTS.json
            /research/HDBLAST_SMEARED_QUANTUM_STATES_20261119/prior/prior/gravity/previous/prior/archive/blast_common.py
            /research/HDBLAST_SMEARED_QUANTUM_STATES_20261119/prior/prior/gravity/previous/prior/background/background.py
            /research/HDBLAST_SMEARED_QUANTUM_STATES_20261119/prior/prior/gravity/previous/prior/curvature/curvature.py
            /research/HDBLAST_SMEARED_QUANTUM_STATES_20261119/prior/prior/gravity/previous/prior/hilltop/HILLTOP.json
            /research/HDBLAST_SMEARED_QUANTUM_STATES_20261119/prior/prior/gravity/previous/prior/hilltop/check.py
            /research/HDBLAST_SMEARED_QUANTUM_STATES_20261119/prior/prior/gravity/previous/prior/hilltop/hilltop.py
            /research/HDBLAST_SMEARED_QUANTUM_STATES_20261119/radiation/PHOTONS.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the archive and its historical inputs
        run: |
          echo '8feed1724ef79c2b2485ea3ae60a8b8e0ae5c1288f81e12593b46facfae1cdef  SHA256SUMS' | sha256sum -c -
          python -I -B -S reproduce.py
          python -I -B -S - <<'PYTHON'
          import json
          from pathlib import Path
          root = Path.cwd().parents[1]
          for record in json.loads(Path("SOURCES.json").read_text())["sources"]:
              if (root / record["path"]).read_bytes() != Path(record["bundled"]).read_bytes():
                  raise ValueError("Historical input differs from its repository path: " + record["path"])
          PYTHON
      - name: Regenerate the numerical results
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python -m pip install numpy==2.3.5 scipy==1.17.0
          python -I -B reproduce.py --verify --jobs 2
