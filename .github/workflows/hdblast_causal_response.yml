name: Fixed-geometry causal response

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/HDBLAST_CHECKPOINT_20261002_CAUSAL_RESPONSE/**'
      - '.github/workflows/hdblast_causal_response.yml'
  pull_request:
    paths:
      - 'research/HDBLAST_CHECKPOINT_20261002_CAUSAL_RESPONSE/**'
      - '.github/workflows/hdblast_causal_response.yml'

permissions:
  contents: read

jobs:
  registered-response-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONOPTIMIZE: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: research/HDBLAST_CHECKPOINT_20261002_CAUSAL_RESPONSE
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact replay dependencies
        run: |
          python -m pip install --only-binary=:all: -r research/HDBLAST_CHECKPOINT_20261002_CAUSAL_RESPONSE/requirements-replay.txt
      - name: Replay frozen experiment and independent validation
        run: |
          python research/HDBLAST_CHECKPOINT_20261002_CAUSAL_RESPONSE/code/replay_checkpoint.py --output "$RUNNER_TEMP/causal-response-replay"
      - name: Retain actual execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: causal-response-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/causal-response-replay/
          if-no-files-found: warn
          retention-days: 7
