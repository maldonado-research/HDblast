name: Initial cutoff enclosures
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/HDBLAST_INITIAL_CUTOFF_ENCLOSURES_20261030/**'
      - '.github/workflows/initial-cutoff-enclosures-20261030.yml'
  push:
    branches: [main]
    paths:
      - 'research/HDBLAST_INITIAL_CUTOFF_ENCLOSURES_20261030/**'
      - '.github/workflows/initial-cutoff-enclosures-20261030.yml'
permissions:
  contents: read
jobs:
  exact-and-interval-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Continuous refinement and independent audits in both modes
        shell: bash
        run: |
          set -euo pipefail
          cap=research/HDBLAST_INITIAL_CUTOFF_ENCLOSURES_20261030
          for mode in normal optimized; do
            flags=()
            if [ "$mode" = optimized ]; then flags=(-O); fi
            python -I -S -B "${flags[@]}" "$cap/checks/check_initial_refinement.py" --repo-root . > "$RUNNER_TEMP/REFINED.$mode.json"
            python -I -S -B "${flags[@]}" "$cap/checks/check_refined_response.py" --repo-root . --refined-report "$RUNNER_TEMP/REFINED.$mode.json" > "$RUNNER_TEMP/RESPONSE.$mode.json"
            python -I -S -B "${flags[@]}" "$cap/checks/check_refinement_guards.py" --repo-root . --refined-report "$RUNNER_TEMP/REFINED.$mode.json" > "$RUNNER_TEMP/GUARDS.$mode.json"
            python -I -S -B "${flags[@]}" "$cap/checks/check_initial_points.py" --repo-root . > "$RUNNER_TEMP/POINTS.$mode.json"
          done
          for report in REFINED RESPONSE GUARDS POINTS; do
            cmp "$RUNNER_TEMP/$report.normal.json" "$RUNNER_TEMP/$report.optimized.json"
            cmp "$RUNNER_TEMP/$report.normal.json" "$cap/reference/$report.json"
          done
          cat "$RUNNER_TEMP/GUARDS.normal.json"
          python -c 'import json,sys;d=json.load(open(sys.argv[1]));print(json.dumps({k:d[k] for k in ("status","readable_direct_C1_X_error_strict_upper","coverage_audit","refined_point_interval_containment_checks")}))' "$RUNNER_TEMP/RESPONSE.normal.json"
