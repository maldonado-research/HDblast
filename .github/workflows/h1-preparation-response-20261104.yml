name: H1 preparation response replay
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/HDBLAST_H1_PREPARATION_RESPONSE_20261104/**'
      - '.github/workflows/h1-preparation-response-20261104.yml'
  push:
    branches: [main]
    paths:
      - 'research/HDBLAST_H1_PREPARATION_RESPONSE_20261104/**'
      - '.github/workflows/h1-preparation-response-20261104.yml'
permissions:
  contents: read
jobs:
  h1-preparation-response:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Replay H1 energy response, preparation-image identities and exact controls
        run: python -I -S -B research/HDBLAST_H1_PREPARATION_RESPONSE_20261104/checks/run_checkpoint.py --repo-root . --output-dir "$RUNNER_TEMP/h1-preparation-response-fresh"
