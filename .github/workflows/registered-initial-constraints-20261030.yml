name: Registered physical initial-data binding
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/HDBLAST_REGISTERED_INITIAL_CONSTRAINTS_20261030/**'
      - '.github/workflows/registered-initial-constraints-20261030.yml'
  push:
    branches: [main]
    paths:
      - 'research/HDBLAST_REGISTERED_INITIAL_CONSTRAINTS_20261030/**'
      - '.github/workflows/registered-initial-constraints-20261030.yml'
permissions:
  contents: read
jobs:
  exact-initial-binding:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Replay exact physical constraints, ADM assembly and independent audit
        run: python -I -S -B research/HDBLAST_REGISTERED_INITIAL_CONSTRAINTS_20261030/checks/run_checkpoint.py --repo-root . --output-dir "$RUNNER_TEMP/registered-initial-fresh"
